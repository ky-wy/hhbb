    <button class="cyber-btn red" id="btnLeave">🚪 退出房间</button>
    <div style="font-size: 14px; color: #888; margin-top: 10px;"><span id="ejectCountdown">10</span>秒后自动观战</div>
  </div>

  <!-- 观战界面 -->
  <div id="spectateScreen">
    <div class="spectate-controls">
      <button class="cyber-btn" id="btnExitSpectate" style="font-size: 10px; padding: 8px 12px;">退出观战</button>
    </div>
  </div>

  <!-- 破坏警告 -->
  <div id="sabotageAlert">⚠️ 系统失效</div>

  <!-- 控制警告 -->
  <div class="control-warning" id="controlWarning">⚠️ 系统入侵 ⚠️</div>

  <!-- 幽灵指示 -->
  <div id="ghostIndicator">🔮 幽灵模式</div>

  <!-- 游戏结束 -->
  <div id="gameEndScreen">
    <div class="winner-text" id="winnerText"></div>
    <div style="font-size: 14px; color: #888;" id="endReason"></div>
    <div style="font-size: 12px; color: #666; margin-top: 10px;">10秒后返回大厅...</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>

    // ==================== 游戏状态 ====================
    const socket = io();
    let gameState = {
      roomCode: null,
      playerId: null,
      playerName: '',
      role: null,
      companion: null,
      tasks: [],
      charge: 0,
      alive: true,
      ghost: false,
      eliminated: false,
      spectating: false,
      inVent: false,
      map: null,
      players: new Map(),
      myX: 1200, myY: 950,
      cameraX: 0, cameraY: 0,
      zoom: 1,
      minimapZoom: 0.08,
      killCooldown: 0,
      ventCooldown: 0,
      sabotageCooldown: 0,
      voted: false,
      currentTask: null,
      effects: [],
      traps: [],
      sabotages: {},
      chatChannel: 'living',
      isGhostChat: false,
      gamePhase: 'lobby',
      barrierActive: false,
      cursed: false,
      invisible: false,
      controlled: false,
      speedMultiplier: 1,
      injured: false,
      weak: false,
      antiCurse: false,
      resurrected: false,
      silenced: false,
      remoteTaskUses: 0,
      invisUses: 0,
      trapPlaced: false,
      controlAttackUsed: false,
      summonUsed: false,
      barrierUsed: false,
      deathTransferUsed: false,
      disguiseTarget: null,
      disguised: false,
      ventReadout: 0,
      emergencyUsed: 0,
      animTime: 0
    };

    const MAP_WIDTH = 2400;
    const MAP_HEIGHT = 1800;
    const COLORS = {
      cyan: '#00f0ff',
      magenta: '#ff00ff',
      purple: '#b300ff',
      red: '#ff3131',
      green: '#00ff88',
      dark: '#0a0a0a',
      grid: '#1a1a2e'
    };

    // ==================== Canvas设置 ====================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const minimapCtx = minimapCanvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      minimapCanvas.width = 120;
      minimapCanvas.height = 120;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // ==================== 大厅逻辑 ====================
    document.getElementById('createRoomBtn').addEventListener('click', () => {
      const name = document.getElementById('playerName').value.trim();
      if (!name) return alert('请输入代号');
      gameState.playerName = name;
      socket.emit('create_room', {}, (res) => {
        if (res.success) joinRoom(res.code, name);
      });
    });

    document.getElementById('joinRoomBtn').addEventListener('click', () => {
      const name = document.getElementById('playerName').value.trim();
      const code = document.getElementById('roomCode').value.trim();
      if (!name) return alert('请输入代号');
      if (!code || code.length !== 6) return alert('请输入6位房间号');
      gameState.playerName = name;
      joinRoom(code, name);
    });

    function joinRoom(code, name) {
      socket.emit('join_room', { code, name }, (res) => {
        if (res.success) {
          gameState.roomCode = code;
          gameState.playerId = res.playerId;
          document.getElementById('nameForm').style.display = 'none';
          document.getElementById('roomLobby').style.display = 'block';
          document.getElementById('displayRoomCode').textContent = code;
          updateLobbyList(res.players);
        } else {
          alert(res.error);
        }
      });
    }

    document.getElementById('readyBtn').addEventListener('click', () => {
      socket.emit('ready');
    });

    socket.on('player_joined', (data) => {
      const list = document.getElementById('lobbyPlayerList');
      const div = document.createElement('div');
      div.className = 'player-item';
      div.id = 'lobby-' + data.id;
      div.innerHTML = `<span class="emoji">${data.emoji}</span><span>${data.name}</span><span class="ready">未准备</span>`;
      list.appendChild(div);
    });

    socket.on('player_ready', (data) => {
      const el = document.getElementById('lobby-' + data.playerId);
      if (el) el.querySelector('.ready').textContent = data.ready ? '✓ 已准备' : '未准备';
    });

    socket.on('player_left', (data) => {
      const el = document.getElementById('lobby-' + data.playerId);
      if (el) el.remove();
    });

    function updateLobbyList(players) {
      const list = document.getElementById('lobbyPlayerList');
      list.innerHTML = '';
      players.forEach(p => {
        const div = document.createElement('div');
        div.className = 'player-item';
        div.id = 'lobby-' + p.id;
        div.innerHTML = `<span class="emoji">${p.emoji}</span><span>${p.name}</span><span class="ready">${p.ready ? '✓ 已准备' : '未准备'}</span>`;
        list.appendChild(div);
      });
    }

    // ==================== 伙伴选择 ====================
    socket.on('companion_select', (data) => {
      document.getElementById('lobbyScreen').style.display = 'none';
      document.getElementById('companionScreen').style.display = 'flex';
      const grid = document.getElementById('companionGrid');
      grid.innerHTML = '';
      data.companions.forEach(c => {
        const card = document.createElement('div');
        card.className = 'companion-card';
        card.id = 'comp-' + c.id;
        card.innerHTML = `<h3>${c.name}</h3><p>${c.passive?.effect || ''}</p><p style="color:#00f0ff;margin-top:4px;">${c.active?.impostor?.effect || c.active?.both?.effect || c.active?.crew?.effect || ''}</p>`;
        card.addEventListener('click', () => {
          socket.emit('select_companion', { companionId: c.id });
        });
        grid.appendChild(card);
      });

      let timeLeft = data.timeLeft;
      const timer = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) clearInterval(timer);
      }, 1000);
    });

    socket.on('companion_selected', (data) => {
      document.querySelectorAll('.companion-card').forEach(c => c.classList.remove('selected'));
      const card = document.getElementById('comp-' + data.companion.id);
      if (card) card.classList.add('selected');
    });

    // ==================== 游戏开始 ====================
    socket.on('game_start', (data) => {
      gameState.map = data.map;
      gameState.gamePhase = 'playing';
      document.getElementById('companionScreen').style.display = 'none';
      document.getElementById('gameHUD').style.display = 'block';

      data.players.forEach(p => {
        gameState.players.set(p.id, p);
      });

      requestAnimationFrame(gameLoop);
    });

    socket.on('personal_data', (data) => {
      gameState.role = data.role;
      gameState.companion = data.companion;
      gameState.tasks = data.tasks || [];
      gameState.charge = data.charge || 0;
      updateTaskPanel();

      // 显示内鬼按钮
      if (data.role === 'impostor') {
        document.getElementById('btnKill').style.display = 'flex';
        document.getElementById('btnVent').style.display = 'flex';
        document.getElementById('btnSabotage').style.display = 'flex';
        document.getElementById('impostorChat').style.display = 'block';
      }

      // 虞瑜额外视野
      if (data.companion?.id === 'yuyu' && data.role === 'crew') {
        gameState.visionBonus = 0.3;
      }
    });

    // ==================== 虚拟摇杆 ====================
    const joystick = document.getElementById('joystick');
    const joystickKnob = document.getElementById('joystickKnob');
    let joystickActive = false;
    let joystickCenter = { x: 60, y: 60 };
    let joystickPos = { x: 0, y: 0 };

    joystick.addEventListener('touchstart', (e) => {
      e.preventDefault();
      joystickActive = true;
      updateJoystick(e.touches[0]);
    }, { passive: false });

    joystick.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (joystickActive) updateJoystick(e.touches[0]);
    }, { passive: false });

    joystick.addEventListener('touchend', (e) => {
      e.preventDefault();
      joystickActive = false;
      joystickKnob.style.transform = 'translate(-50%, -50%)';
      joystickPos = { x: 0, y: 0 };
      socket.emit('move', { vx: 0, vy: 0 });
    });

    function updateJoystick(touch) {
      const rect = joystick.getBoundingClientRect();
      const x = touch.clientX - rect.left - 60;
      const y = touch.clientY - rect.top - 60;
      const dist = Math.sqrt(x*x + y*y);
      const maxDist = 45;
      const clamped = dist > maxDist ? maxDist : dist;
      const angle = Math.atan2(y, x);

      const nx = Math.cos(angle) * clamped;
      const ny = Math.sin(angle) * clamped;

      joystickKnob.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
      joystickPos = { x: nx / maxDist, y: ny / maxDist };

      socket.emit('move', { vx: joystickPos.x, vy: joystickPos.y });
    }

    // ==================== 功能按钮 ====================
    document.getElementById('btnKill').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState.killCooldown <= 0 && gameState.alive && !gameState.ghost && !gameState.controlled) {
        socket.emit('kill');
      }
    });

    document.getElementById('btnTask').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState.role === 'crew' && gameState.alive && !gameState.ghost && !gameState.controlled) {
        socket.emit('task_interact');
      }
    });

    document.getElementById('btnReport').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState.alive && !gameState.ghost && !gameState.controlled) {
        socket.emit('report_body');
      }
    });

    document.getElementById('btnAbility').addEventListener('touchstart', (e) => {
      e.preventDefault();
      showAbilityMenu();
    });

    document.getElementById('btnVent').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState.role === 'impostor' && gameState.alive && !gameState.ghost) {
        if (gameState.inVent) {
          showVentMap();
        } else {
          socket.emit('use_vent', {});
        }
      }
    });

    document.getElementById('btnSabotage').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState.role === 'impostor' && gameState.alive && !gameState.ghost && gameState.sabotageCooldown <= 0) {
        showSabotageMenu();
      }
    });

    // ==================== 地图缩放 ====================
    document.getElementById('zoomIn').addEventListener('click', () => {
      gameState.zoom = Math.min(2, gameState.zoom + 0.2);
    });
    document.getElementById('zoomOut').addEventListener('click', () => {
      gameState.zoom = Math.max(0.5, gameState.zoom - 0.2);
    });

    let lastPinchDist = 0;
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        lastPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const delta = dist - lastPinchDist;
        gameState.zoom = Math.max(0.5, Math.min(2, gameState.zoom + delta * 0.005));
        lastPinchDist = dist;
      }
    }, { passive: true });

    // ==================== 游戏循环 ====================
    function gameLoop(timestamp) {
      gameState.animTime = timestamp;

      // 更新冷却
      if (gameState.killCooldown > 0) gameState.killCooldown -= 1/60;
      if (gameState.ventCooldown > 0) gameState.ventCooldown -= 1/60;
      if (gameState.sabotageCooldown > 0) gameState.sabotageCooldown -= 1/60;

      // 更新相机
      const me = gameState.players.get(gameState.playerId);
      if (me) {
        gameState.myX = me.x;
        gameState.myY = me.y;
      }

      const targetCamX = gameState.myX - canvas.width / 2 / gameState.zoom;
      const targetCamY = gameState.myY - canvas.height / 2 / gameState.zoom;
      gameState.cameraX += (targetCamX - gameState.cameraX) * 0.1;
      gameState.cameraY += (targetCamY - gameState.cameraY) * 0.1;

      // 渲染
      render();
      renderMinimap();

      requestAnimationFrame(gameLoop);
    }

    // ==================== 渲染主地图 ====================
    function render() {
      ctx.fillStyle = COLORS.dark;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(gameState.zoom, gameState.zoom);
      ctx.translate(-gameState.cameraX, -gameState.cameraY);

      // 绘制网格背景
      drawGrid();

      // 绘制房间
      if (gameState.map) {
        drawRooms();
        drawCorridors();
        drawDecorations();
        drawTasks();
        drawVents();
        drawTraps();
        drawEffects();
        drawPlayers();
        drawEmergencyButton();
      }

      ctx.restore();

      // 破坏效果蒙层
      if (gameState.sabotages.electrical) {
        ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 幽灵模式标记
      if (gameState.ghost) {
        ctx.fillStyle = 'rgba(179, 0, 255, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 被控制警告
      if (gameState.controlled) {
        ctx.strokeStyle = COLORS.red;
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
      }

      // 诅咒倒计时
      if (gameState.cursed) {
        ctx.fillStyle = COLORS.red;
        ctx.font = 'bold 24px Orbitron';
        ctx.textAlign = 'center';
        ctx.fillText('☠️ 诅咒中', canvas.width / 2, 80);
      }

      // 更新按钮状态
      updateActionButtons();
    }

    function drawGrid() {
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 1;
      const gridSize = 50;
      const startX = Math.floor(gameState.cameraX / gridSize) * gridSize;
      const startY = Math.floor(gameState.cameraY / gridSize) * gridSize;
      const endX = startX + canvas.width / gameState.zoom + gridSize;
      const endY = startY + canvas.height / gameState.zoom + gridSize;

      ctx.beginPath();
      for (let x = startX; x < endX; x += gridSize) {
        ctx.moveTo(x, startY);
        ctx.lineTo(x, endY);
      }
      for (let y = startY; y < endY; y += gridSize) {
        ctx.moveTo(startX, y);
        ctx.lineTo(endX, y);
      }
      ctx.stroke();
    }

    function drawRooms() {
      gameState.map.rooms.forEach(room => {
        // 房间背景
        ctx.fillStyle = 'rgba(10, 15, 30, 0.6)';
        ctx.fillRect(room.x, room.y, room.w, room.h);

        // 霓虹边框
        ctx.strokeStyle = room.color || COLORS.cyan;
        ctx.lineWidth = 2;
        ctx.shadowColor = room.color || COLORS.cyan;
        ctx.shadowBlur = 10;
        ctx.strokeRect(room.x, room.y, room.w, room.h);
        ctx.shadowBlur = 0;

        // 房间名称
        ctx.fillStyle = room.color || COLORS.cyan;
        ctx.font = 'bold 14px Orbitron';
        ctx.textAlign = 'center';
        ctx.shadowColor = room.color || COLORS.cyan;
        ctx.shadowBlur = 15;
        ctx.fillText(room.name, room.x + room.w / 2, room.y - 8);
        ctx.shadowBlur = 0;
      });
    }

    function drawCorridors() {
      if (!gameState.map.corridors) return;
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
      ctx.lineWidth = 40;
      ctx.lineCap = 'round';

      gameState.map.corridors.forEach(corr => {
        const from = gameState.map.rooms.find(r => r.id === corr.from);
        const to = gameState.map.rooms.find(r => r.id === corr.to);
        if (from && to) {
          ctx.beginPath();
          ctx.moveTo(from.x + from.w / 2, from.y + from.h / 2);
          ctx.lineTo(to.x + to.w / 2, to.y + to.h / 2);
          ctx.stroke();
        }
      });
    }

    function drawDecorations() {
      if (!gameState.map.rooms) return;
      gameState.map.rooms.forEach(room => {
        const cx = room.x + room.w / 2;
        const cy = room.y + room.h / 2;

        switch (room.id) {
          case 'cafeteria':
            // 圆桌
            ctx.fillStyle = 'rgba(0, 240, 255, 0.1)';
            ctx.beginPath();
            ctx.arc(cx, cy, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = COLORS.cyan;
            ctx.lineWidth = 2;
            ctx.stroke();
            // 悬浮椅子
            for (let i = 0; i < 4; i++) {
              const angle = (Math.PI * 2 / 4) * i;
              const px = cx + Math.cos(angle) * 55;
              const py = cy + Math.sin(angle) * 55;
              ctx.fillStyle = 'rgba(255, 0, 255, 0.2)';
              ctx.fillRect(px - 8, py - 8, 16, 16);
            }
            break;
          case 'electrical':
            // 电箱
            ctx.fillStyle = 'rgba(255, 49, 49, 0.2)';
            ctx.fillRect(room.x + 20, room.y + 20, 60, 80);
            ctx.strokeStyle = COLORS.red;
            ctx.lineWidth = 1;
            ctx.strokeRect(room.x + 20, room.y + 20, 60, 80);
            // 电流纹理动画
            const sparkPhase = (gameState.animTime / 200) % 1;
            ctx.strokeStyle = `rgba(255, 255, 0, ${0.5 + sparkPhase * 0.5})`;
            ctx.beginPath();
            ctx.moveTo(room.x + 30, room.y + 30);
            ctx.lineTo(room.x + 50, room.y + 50);
            ctx.lineTo(room.x + 40, room.y + 70);
            ctx.stroke();
            break;
          case 'o2':
            // 氧气罐
            ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';
            ctx.beginPath();
            ctx.arc(room.x + 50, room.y + 60, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = COLORS.cyan;
            ctx.lineWidth = 2;
            ctx.stroke();
            // 压力表
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(room.x + 90, room.y + 40, 15, 0, Math.PI * 2);
            ctx.fill();
            break;
          case 'weapons':
            // 武器架
            ctx.strokeStyle = COLORS.red;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(room.x + 30, room.y + 30);
            ctx.lineTo(room.x + 30, room.y + 100);
            ctx.stroke();
            // 光剑
            ctx.strokeStyle = COLORS.cyan;
            ctx.lineWidth = 4;
            ctx.shadowColor = COLORS.cyan;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(room.x + 35, room.y + 40);
            ctx.lineTo(room.x + 35, room.y + 80);
            ctx.stroke();
            ctx.shadowBlur = 0;
            break;
          case 'medbay':
            // 扫描床
            ctx.fillStyle = 'rgba(0, 255, 136, 0.15)';
            ctx.fillRect(room.x + 30, room.y + 40, 80, 40);
            ctx.strokeStyle = COLORS.green;
            ctx.lineWidth = 1;
            ctx.strokeRect(room.x + 30, room.y + 40, 80, 40);
            // 全息人体
            ctx.strokeStyle = `rgba(0, 240, 255, ${0.3 + Math.sin(gameState.animTime / 500) * 0.2})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(room.x + 150, room.y + 50, 20, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(room.x + 150, room.y + 70);
            ctx.lineTo(room.x + 150, room.y + 120);
            ctx.stroke();
            break;
          case 'cockpit':
            // 座椅
            ctx.fillStyle = 'rgba(179, 0, 255, 0.2)';
            ctx.fillRect(room.x + 40, room.y + 40, 40, 50);
            // 星图
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(room.x + 100, room.y + 20, 120, 80);
            ctx.strokeStyle = COLORS.purple;
            ctx.lineWidth = 1;
            ctx.strokeRect(room.x + 100, room.y + 20, 120, 80);
            // 星星
            for (let i = 0; i < 5; i++) {
              const sx = room.x + 110 + Math.random() * 100;
              const sy = room.y + 30 + Math.random() * 60;
              ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
              ctx.fillRect(sx, sy, 2, 2);
            }
            break;
          case 'mainframe':
            // 全息屏幕
            ctx.fillStyle = `rgba(0, 240, 255, ${0.1 + Math.sin(gameState.animTime / 300) * 0.05})`;
            ctx.fillRect(room.x + 30, room.y + 20, 100, 60);
            ctx.strokeStyle = COLORS.cyan;
            ctx.lineWidth = 1;
            ctx.strokeRect(room.x + 30, room.y + 20, 100, 60);
            // 数据流
            ctx.fillStyle = COLORS.cyan;
            for (let i = 0; i < 3; i++) {
              const dy = room.y + 25 + i * 15;
              const dx = room.x + 35 + ((gameState.animTime / 50 + i * 20) % 80);
              ctx.fillRect(dx, dy, 15, 3);
            }
            break;
          case 'storage':
            // 货架
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.4)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 3; i++) {
              const sy = room.y + 30 + i * 40;
              ctx.beginPath();
              ctx.moveTo(room.x + 20, sy);
              ctx.lineTo(room.x + room.w - 20, sy);
              ctx.stroke();
            }
            // 箱子
            ctx.fillStyle = 'rgba(139, 69, 19, 0.3)';
            ctx.fillRect(room.x + 40, room.y + 100, 30, 25);
            ctx.fillRect(room.x + 80, room.y + 110, 25, 20);
            break;
        }
      });
    }

    function drawTasks() {
      if (!gameState.map.tasks) return;
      gameState.map.tasks) return;
      gameState.map.tasks.forEach(task => {
        if (task.completed) return;

        // 呼吸动画
        const breathe = 0.7 + Math.sin(gameState.animTime / 400) * 0.3;

        // 全息菱形
        ctx.save();
        ctx.translate(task.x, task.y);
        ctx.rotate(gameState.animTime / 2000);
        ctx.globalAlpha = breathe;
        ctx.fillStyle = COLORS.cyan;
        ctx.shadowColor = COLORS.cyan;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(10, 0);
        ctx.lineTo(0, 12);
        ctx.lineTo(-10, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 如果是当前任务目标，添加箭头指示
        const myTask = gameState.tasks.find(t => t.id === task.id);
        if (myTask && !myTask.completed) {
          ctx.strokeStyle = COLORS.magenta;
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(gameState.myX, gameState.myY);
          ctx.lineTo(task.x, task.y);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });
    }

    function drawVents() {
      if (!gameState.map.vents) return;
      gameState.map.vents.forEach(vent => {
        // 管道口外观
        ctx.fillStyle = 'rgba(30, 30, 40, 0.9)';
        ctx.beginPath();
        ctx.arc(vent.x, vent.y, 18, 0, Math.PI * 2);
        ctx.fill();

        // 金属格栅
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(vent.x, vent.y, 15, 0, Math.PI * 2);
        ctx.stroke();

        // 流动数据光线
        const flowOffset = (gameState.animTime / 30) % 20;
        ctx.strokeStyle = COLORS.cyan;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.6;
        for (let i = 0; i < 3; i++) {
          const angle = (Math.PI * 2 / 3) * i + flowOffset / 20;
          ctx.beginPath();
          ctx.moveTo(vent.x + Math.cos(angle) * 8, vent.y + Math.sin(angle) * 8);
          ctx.lineTo(vent.x + Math.cos(angle) * 14, vent.y + Math.sin(angle) * 14);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      });
    }

    function drawTraps() {
      gameState.traps.forEach(trap => {
        if (trap.triggered) {
          const age = gameState.animTime - trap.triggerTime;
          const progress = age / 3000;
          if (progress < 1) {
            ctx.fillStyle = `rgba(179, 0, 255, ${0.5 * (1 - progress)})`;
            ctx.beginPath();
            ctx.arc(trap.x, trap.y, 30 + progress * 50, 0, Math.PI * 2);
            ctx.fill();

            // 旋涡效果
            ctx.strokeStyle = COLORS.purple;
            ctx.lineWidth = 2;
            for (let i = 0; i < 6; i++) {
              const angle = (Math.PI * 2 / 6) * i + gameState.animTime / 200;
              const r = 20 + progress * 40;
              ctx.beginPath();
              ctx.arc(trap.x, trap.y, r, angle, angle + Math.PI / 3);
              ctx.stroke();
            }
          }
        }
      });
    }

    function drawEffects() {
      gameState.effects.forEach(effect => {
        switch (effect.type) {
          case 'barrier':
            drawBarrier(effect);
            break;
          case 'curse':
            drawCurseEffect(effect);
            break;
          case 'invis':
            // 隐身效果在玩家绘制中处理
            break;
          case 'resurrect':
            drawResurrectEffect(effect);
            break;
          case 'time_stop':
            drawTimeStopEffect(effect);
            break;
          case 'death_transfer':
            drawDeathTransfer(effect);
            break;
        }
      });

        // 六边形边框颜色
        let hexColor = COLORS.cyan;
        if (isMe && gameState.role === 'impostor') hexColor = COLORS.red;
        if (isGhost) hexColor = '#666';
        if (player.barrierActive) hexColor = COLORS.cyan;

        // 绘制六边形头像
        ctx.strokeStyle = hexColor;
        ctx.lineWidth = 3;
        ctx.shadowColor = hexColor;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI * 2 / 6) * i - Math.PI / 6;
          const x = player.x + Math.cos(angle) * 20;
          const y = player.y + Math.sin(angle) * 20;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // 头像背景
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fill();

        // 表情
        ctx.font = '20px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(displayEmoji, player.x, player.y);

        // 名字
        ctx.fillStyle = isGhost ? '#888' : '#fff';
        ctx.font = '11px Orbitron';
        ctx.fillText(displayName, player.x, player.y + 32);

        // 状态图标
        let statusIcon = '🔋';
        if (isGhost) statusIcon = '💀';
        else if (player.barrierActive) statusIcon = '🛡️';
        ctx.fillText(statusIcon, player.x + 25, player.y - 15);

        // 伙伴名称（仅自己可见）
        if (isMe && gameState.companion) {
          ctx.fillStyle = 'rgba(179, 0, 255, 0.6)';
          ctx.font = '9px Orbitron';
          ctx.fillText(gameState.companion.name, player.x, player.y + 44);
        }

        // 全息状态条
        if (!isGhost) {
          const barWidth = 30;
          const barHeight = 3;
          const barY = player.y - 28;
          ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
          ctx.fillRect(player.x - barWidth / 2, barY, barWidth, barHeight);
          ctx.fillStyle = isMe && gameState.role === 'impostor' ? COLORS.red : COLORS.cyan;
          ctx.fillRect(player.x - barWidth / 2, barY, barWidth * (player.alive ? 1 : 0), barHeight);
        }

        ctx.restore();
      });
    }

    function drawEmergencyButton() {
      const cafe = gameState.map.rooms.find(r => r.id === 'cafeteria');
      if (!cafe) return;

      const bx = cafe.x + cafe.w / 2;
      const by = cafe.y + cafe.h / 2 + 30;

      // 红色发光圆柱
      ctx.fillStyle = 'rgba(255, 49, 49, 0.3)';
      ctx.beginPath();
      ctx.arc(bx, by, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = COLORS.red;
      ctx.lineWidth = 2;
      ctx.shadowColor = COLORS.red;
      ctx.shadowBlur = 15;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 闪电图标
      ctx.fillStyle = COLORS.red;
      ctx.font = '16px serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚡', bx, by + 5);
    }

    function renderMinimap() {
      minimapCtx.fillStyle = 'rgba(0, 0, 0, 0.8)';
      minimapCtx.fillRect(0, 0, 120, 120);

      if (!gameState.map) return;

      const scale = gameState.minimapZoom;
      const cx = gameState.myX * scale;
      const cy = gameState.myY * scale;

      minimapCtx.save();
      minimapCtx.translate(60 - cx, 60 - cy);

      // 房间轮廓
      gameState.map.rooms.forEach(room => {
        minimapCtx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
        minimapCtx.lineWidth = 1;
        minimapCtx.strokeRect(room.x * scale, room.y * scale, room.w * scale, room.h * scale);
      });

      // 任务点
      gameState.tasks.forEach(task => {
        if (task.completed) return;
        minimapCtx.fillStyle = COLORS.magenta;
        minimapCtx.fillRect(task.x * scale - 2, task.y * scale - 2, 4, 4);
      });

      // 紧急按钮
      const cafe = gameState.map.rooms.find(r => r.id === 'cafeteria');
      if (cafe) {
        minimapCtx.fillStyle = COLORS.red;
        minimapCtx.font = '8px serif';
        minimapCtx.fillText('⚡', (cafe.x + cafe.w / 2) * scale, (cafe.y + cafe.h / 2 + 30) * scale);
      }

      // 自己
      minimapCtx.fillStyle = COLORS.cyan;
      minimapCtx.beginPath();
      minimapCtx.moveTo(gameState.myX * scale, gameState.myY * scale - 5);
      minimapCtx.lineTo(gameState.myX * scale - 4, gameState.myY * scale + 4);
      minimapCtx.lineTo(gameState.myX * scale + 4, gameState.myY * scale + 4);
      minimapCtx.closePath();
      minimapCtx.fill();

      minimapCtx.restore();

      // 扫描线效果
      minimapCtx.strokeStyle = 'rgba(0, 240, 255, 0.1)';
      minimapCtx.lineWidth = 1;
      const scanY = (gameState.animTime / 50) % 120;
      minimapCtx.beginPath();
      minimapCtx.moveTo(0, scanY);
      minimapCtx.lineTo(120, scanY);
      minimapCtx.stroke();
    }

    function updateActionButtons() {
      const killBtn = document.getElementById('btnKill');
      if (gameState.role === 'impostor' && gameState.alive && !gameState.ghost) {
        killBtn.style.display = 'flex';
        if (gameState.killCooldown > 0) {
          killBtn.classList.add('cooldown');
          killBtn.innerHTML = `<span class="cd-text">${Math.ceil(gameState.killCooldown)}</span>`;
        } else {
          killBtn.classList.remove('cooldown');
          killBtn.innerHTML = '🗡️';
        }
      }

      const ventBtn = document.getElementById('btnVent');
      if (gameState.role === 'impostor' && gameState.alive && !gameState.ghost) {
        ventBtn.style.display = 'flex';
        if (gameState.ventCooldown > 0) {
          ventBtn.classList.add('cooldown');
          ventBtn.innerHTML = `<span class="cd-text">${Math.ceil(gameState.ventCooldown)}</span>`;
        } else {
          ventBtn.classList.remove('cooldown');
          ventBtn.innerHTML = gameState.inVent ? '🚇' : '🚇';
        }
      }

      const sabotageBtn = document.getElementById('btnSabotage');
      if (gameState.role === 'impostor' && gameState.alive && !gameState.ghost) {
        sabotageBtn.style.display = 'flex';
        if (gameState.sabotageCooldown > 0) {
          sabotageBtn.classList.add('cooldown');
          sabotageBtn.innerHTML = `<span class="cd-text">${Math.ceil(gameState.sabotageCooldown)}</span>`;
        } else {
          sabotageBtn.classList.remove('cooldown');
          sabotageBtn.innerHTML = '⚡';
        }
      }
    }

    // ==================== 服务器事件处理 ====================
    socket.on('game_tick', (data) => {
      data.players.forEach(p => {
        const existing = gameState.players.get(p.id);
        if (existing) {
          Object.assign(existing, p);
        } else {
          gameState.players.set(p.id, p);
        }
      });
      gameState.sabotages = data.sabotages || {};
    });

    socket.on('player_killed', (data) => {
      const player = gameState.players.get(data.victimId);
      if (player) {
        player.alive = false;
        player.ghost = true;
      }
      if (data.victimId === gameState.playerId) {
        gameState.alive = false;
        gameState.ghost = true;
        document.getElementById('ghostIndicator').style.display = 'block';
      }
      // 添加死亡特效
      if (data.cause === 'curse') {
        gameState.effects.push({
          type: 'curse_death',
          playerId: data.victimId,
          startTime: Date.now(),
          endTime: Date.now() + 2000
        });
      }
    });

    socket.on('you_died', (data) => {
      gameState.alive = false;
      gameState.ghost = true;
      document.getElementById('ghostIndicator').style.display = 'block';
      showToast('💀 你已成为幽灵');
    });

    socket.on('barrier_activated', (data) => {
      const player = gameState.players.get(data.playerId);
      if (player) player.barrierActive = true;
      if (data.playerId === gameState.playerId) {
        gameState.barrierActive = true;
        showToast('🛡️ 屏障已激活');
      }
      gameState.effects.push({
        type: 'barrier',
        playerId: data.playerId,
        endTime: Date.now() + 3000
      });
    });

    socket.on('player_injured', (data) => {
      const player = gameState.players.get(data.playerId);
      if (player) player.injured = true;
      if (data.playerId === gameState.playerId) {
        gameState.injured = true;
        gameState.weak = true;
        showToast('⚠️ 受伤！移速降低');
      }
    });

    socket.on('curse_blocked', () => {
      showToast('✨ 诅咒被夜莺抵消');
    });

    socket.on('curse_immune', () => {
      showToast('🛡️ 免疫诅咒');
    });

    socket.on('death_transferred', (data) => {
      gameState.effects.push({
        type: 'death_transfer',
        from: data.from,
        to: data.to,
        startTime: Date.now()
      });
    });

    socket.on('killer_rooted', (data) => {
      showToast('🌿 袭击者被定身15秒');
    });

    socket.on('trap_placed', (data) => {
      gameState.traps.push({
        x: data.x, y: data.y,
        placedBy: data.playerId,
        triggered: false
      });
      // 布置者闪光
      if (data.playerId !== gameState.playerId) {
        showToast('⚡ 侦测到异常能量波动');
      }
    });

    socket.on('trap_triggered', (data) => {
      gameState.traps.forEach(t => {
        if (Math.abs(t.x - data.x) < 5 && Math.abs(t.y - data.y) < 5) {
          t.triggered = true;
          t.triggerTime = Date.now();
        }
      });
    });

    socket.on('player_invis', (data) => {
      const player = gameState.players.get(data.playerId);
      if (player) player.invisible = true;
    });

    socket.on('player_vis', (data) => {
      const player = gameState.players.get(data.playerId);
      if (player) player.invisible = false;
    });

    socket.on('time_stopped', (data) => {
      gameState.effects.push({
        type: 'time_stop',
        playerId: data.playerId,
        endTime: Date.now() + data.duration * 1000
      });
      showToast('⏱️ 时间暂停！');
    });

    socket.on('player_disguised', (data) => {
      const player = gameState.players.get(data.playerId);
      if (player) {
        player.disguised = true;
        player.disguiseTarget = data.targetId;
      }
    });

    socket.on('player_undisguised', (data) => {
      const player = gameState.players.get(data.playerId);
      if (player) {
        player.disguised = false;
        player.disguiseTarget = null;
      }
    });

    socket.on('player_cursed', (data) => {
      const player = gameState.players.get(data.playerId);
      if (player) player.cursed = true;
      if (data.playerId === gameState.playerId) {
        gameState.cursed = true;
        showToast('☠️ 你被诅咒了！10秒后死亡');
      }
      gameState.effects.push({
        type: 'curse',
        playerId: data.playerId,
        endTime: Date.now() + 10000
      });
    });

    socket.on('mind_controlled', (data) => {
      gameState.controlled = true;
      document.getElementById('controlWarning').style.display = 'block';
      showToast('⚠️ 系统入侵！意识中断');
    });

    socket.on('control_released', () => {
      gameState.controlled = false;
      document.getElementById('controlWarning').style.display = 'none';
      showToast('✅ 控制解除');
    });

    socket.on('player_resurrected', (data) => {
      const player = gameState.players.get(data.playerId);
      if (player) {
        player.alive = true;
        player.ghost = false;
      }
      if (data.playerId === gameState.playerId) {
        gameState.alive = true;
        gameState.ghost = false;
        gameState.resurrected = true;
        document.getElementById('ghostIndicator').style.display = 'none';
        showToast('✨ 你被复活了！');
      }
      gameState.effects.push({
        type: 'resurrect',
        playerId: data.playerId,
        startTime: Date.now()
      });
    });

    socket.on('speed_boosted', (data) => {
      gameState.speedMultiplier = 1.5;
      showToast('⚡ 移速提升');
      setTimeout(() => { gameState.speedMultiplier = 1; }, data.duration * 1000);
    });

    socket.on('anti_curse_activated', () => {
      gameState.antiCurse = true;
      showToast('🛡️ 反制状态已激活');
    });

    socket.on('inspect_result', (data) => {
      const result = data.isImpostor ? '🔴 内鬼' : '🟢 船员';
      showToast(`查验结果: ${result}`);
    });

    socket.on('vent_sense_result', (data) => {
      showToast(data.occupied ? '🔴 感应到异常数据流' : '🟢 管道安全');
    });

    socket.on('sabotage_started', (data) => {
      gameState.sabotages[data.type] = { startTime: Date.now() };
      if (gameState.role === 'crew') {
        document.getElementById('sabotageAlert').style.display = 'block';
        setTimeout(() => {
          document.getElementById('sabotageAlert').style.display = 'none';
        }, 3000);
      }
      if (data.type === 'o2') {
        document.getElementById('oxygenTimer').style.display = 'block';
        startOxygenTimer(data.duration || 60);
      }
      if (data.type === 'electrical') {
        showToast('⚡ 电力系统被破坏！视野受限');
      }
    });

    socket.on('sabotage_fixed', (data) => {
      delete gameState.sabotages[data.type];
      if (data.type === 'o2') {
        document.getElementById('oxygenTimer').style.display = 'none';
      }
      showToast('✅ 系统已修复');
    });

    socket.on('task_progress', (data) => {
      const pct = (data.completed / data.total) * 100;
      document.getElementById('taskProgress').style.width = pct + '%';
    });

    socket.on('task_done', (data) => {
      gameState.charge = data.charge;
      document.getElementById('chargeDisplay').textContent = `🔋 × ${gameState.charge}/3`;
      const task = gameState.tasks.find(t => t.id === data.taskId);
      if (task) task.completed = true;
      updateTaskPanel();
      showToast('✅ 任务完成 +1充能');
    });

    socket.on('meeting_called', (data) => {
      gameState.gamePhase = 'meeting';
      gameState.voted = false;
      showMeeting(data);
    });

    socket.on('meeting_tick', (data) => {
      document.getElementById('meetingTimer').textContent = data.timeLeft;
    });

    socket.on('player_voted', (data) => {
      const btn = document.querySelector(`[data-voter="${data.playerId}"]`);
      if (btn) btn.textContent = '已投票';
    });

    socket.on('meeting_ended', (data) => {
      hideMeeting();
      if (data.ejected) {
        const player = gameState.players.get(data.ejected);
        if (player) {
          player.eliminated = true;
          player.alive = false;
          player.ghost = false;
        }
        showToast(`⚡ ${player?.name || '某人'} 被放逐`);
      } else {
        showToast('🤝 平票，无人被放逐');
      }
    });

    socket.on('player_ejected', (data) => {
      const player = gameState.players.get(data.playerId);
      if (player) {
        player.eliminated = true;
        player.alive = false;
      }
    });

    socket.on('you_ejected', () => {
      gameState.eliminated = true;
      gameState.alive = false;
      gameState.ghost = false;
      showEjectedScreen();
    });

    socket.on('tactical_window', (data) => {
      gameState.gamePhase = 'tactical';
      showToast(`⚔️ 战术窗口 ${data.duration}秒`);
    });

    socket.on('tactical_ended', () => {
      gameState.gamePhase = 'playing';
      showToast('▶️ 自由活动阶段');
    });

    socket.on('game_ended', (data) => {
      gameState.gamePhase = 'ended';
      showGameEnd(data);
    });

    socket.on('return_lobby', () => {
      resetGame();
      document.getElementById('gameHUD').style.display = 'none';
      document.getElementById('gameEndScreen').style.display = 'none';
      document.getElementById('lobbyScreen').style.display = 'flex';
      document.getElementById('nameForm').style.display = 'block';
      document.getElementById('roomLobby').style.display = 'none';
    });

    socket.on('chat_message', (data) => {
      addChatMessage(data);
    });

    socket.on('task_start', (data) => {
      showTaskQTE(data.task);
    });

    socket.on('vent_entered', (data) => {
      if (data.playerId === gameState.playerId) {
        gameState.inVent = true;
        showToast('🚇 进入管道');
      }
    });

    socket.on('vent_exited', (data) => {
      if (data.playerId === gameState.playerId) {
        gameState.inVent = false;
        gameState.myX = data.x;
        gameState.myY = data.y;
        showToast('🚇 离开管道');
      }
    });

    // ==================== 任务QTE系统 ====================
    function showTaskQTE(task) {
      gameState.currentTask = task;
      const overlay = document.getElementById('taskOverlay');
      const window = document.getElementById('taskWindow');
      overlay.style.display = 'flex';
      window.innerHTML = '';

      const title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = getTaskName(task.type);
      window.appendChild(title);

      const timer = document.createElement('div');
      timer.className = 'task-timer';
      timer.id = 'taskTimer';
      window.appendChild(timer);

      switch (task.type) {
        case 'clean_fan':
          createCleanFanTask(window, timer);
          break;
        case 'swipe_card':
          createSwipeCardTask(window, timer);
          break;
        case 'wiring':
          createWiringTask(window, timer);
          break;
        case 'password':
          createPasswordTask(window, timer);
          break;
        case 'calibrate':
          createCalibrateTask(window, timer);
          break;
        case 'upload':
          createUploadTask(window, timer);
          break;
      }
    }

    function getTaskName(type) {
      const names = {
        'clean_fan': '清理电风扇',
        'swipe_card': '刷卡认证',
        'wiring': '接线修复',
        'password': '密码解密',
        'calibrate': '校准天线',
        'upload': '数据上传'
      };
      return names[type] || '未知任务';
    }

    function createCleanFanTask(container, timerEl) {
      let timeLeft = 8;
      let stainsLeft = 5;

      const fanContainer = document.createElement('div');
      fanContainer.className = 'fan-container';

      // 风扇叶片
      for (let i = 0; i < 3; i++) {
        const blade = document.createElement('div');
        blade.className = 'fan-blade';
        blade.style.transform = `rotate(${i * 120}deg)`;
        fanContainer.appendChild(blade);
      }

      // 污渍
      const stains = [];
      for (let i = 0; i < 5; i++) {
        const stain = document.createElement('div');
        stain.className = 'fan-stain';
        stain.style.left = (30 + Math.random() * 140) + 'px';
        stain.style.top = (30 + Math.random() * 140) + 'px';
        stain.addEventListener('click', () => {
          stain.remove();
          stainsLeft--;
          if (stainsLeft <= 0) completeTask();
        });
        fanContainer.appendChild(stain);
        stains.push(stain);
      }

      container.appendChild(fanContainer);

      const timer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          closeTaskOverlay();
        }
      }, 1000);
    }

    function createSwipeCardTask(container, timerEl) {
      let timeLeft = 8;
      let swiping = false;
      let cardX = 0;
      let success = false;

      const track = document.createElement('div');
      track.className = 'swipe-track';

      const zone = document.createElement('div');
      zone.className = 'swipe-zone';
      track.appendChild(zone);

      const card = document.createElement('div');
      card.className = 'swipe-card';
      card.textContent = '💳';
      track.appendChild(card);

      container.appendChild(track);

      const status = document.createElement('div');
      status.style.marginTop = '10px';
      status.style.fontSize = '12px';
      status.textContent = '按住卡片向右滑动到绿色区域';
      container.appendChild(status);

      let startX = 0;

      card.addEventListener('touchstart', (e) => {
        e.preventDefault();
        swiping = true;
        startX = e.touches[0].clientX;
      }, { passive: false });

      card.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!swiping) return;
        const dx = e.touches[0].clientX - startX;
        cardX = Math.max(0, Math.min(track.offsetWidth - 40, dx));
        card.style.left = cardX + 'px';

        const zoneStart = track.offsetWidth * 0.6;
        const zoneEnd = track.offsetWidth * 0.8;
        if (cardX >= zoneStart && cardX <= zoneEnd) {
          status.textContent = '✅ 速度正确！保持...';
          status.style.color = '#00ff88';
        } else {
          status.textContent = '⬅️ 滑动到绿色区域';
          status.style.color = COLORS.cyan;
        }
      }, { passive: false });

      card.addEventListener('touchend', () => {
        swiping = false;
        const zoneStart = track.offsetWidth * 0.6;
        const zoneEnd = track.offsetWidth * 0.8;
        if (cardX >= zoneStart && cardX <= zoneEnd) {
          success = true;
          completeTask();
        } else {
          card.style.transition = 'left 0.3s';
          card.style.left = '0px';
          setTimeout(() => { card.style.transition = ''; }, 300);
        }
      });

      const timer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 0 && !success) {
          clearInterval(timer);
          closeTaskOverlay();
        }
      }, 1000);
    }

    function createWiringTask(container, timerEl) {
      let timeLeft = 15;
      let connections = 0;
      const totalConnections = 4;
      const colors = ['#ff3131', '#00f0ff', '#ff00ff', '#00ff88'];
      const colorNames = ['🔴', '🔵', '🟣', '🟢'];

      const wiringContainer = document.createElement('div');
      wiringContainer.className = 'wiring-container';

      const leftCol = document.createElement('div');
      leftCol.className = 'wire-col';
      const rightCol = document.createElement('div');
      rightCol.className = 'wire-col';

      const leftPorts = [];
      const rightPorts = [];
      const shuffledColors = [...colors].sort(() => Math.random() - 0.5);

      for (let i = 0; i < 4; i++) {
        const leftPort = document.createElement('div');
        leftPort.className = 'wire-port';
        leftPort.style.borderColor = colors[i];
        leftPort.style.color = colors[i];
        leftPort.textContent = colorNames[i];
        leftPort.dataset.color = colors[i];
        leftCol.appendChild(leftPort);
        leftPorts.push(leftPort);

        const rightPort = document.createElement('div');
        rightPort.className = 'wire-port';
        rightPort.style.borderColor = shuffledColors[i];
        rightPort.style.color = shuffledColors[i];
        rightPort.textContent = colorNames[colors.indexOf(shuffledColors[i])];
        rightPort.dataset.color = shuffledColors[i];
        rightCol.appendChild(rightPort);
        rightPorts.push(rightPort);
      }

      wiringContainer.appendChild(leftCol);
      wiringContainer.appendChild(rightCol);
      container.appendChild(wiringContainer);

      let selectedLeft = null;

      leftPorts.forEach(port => {
        port.addEventListener('click', () => {
          if (port.classList.contains('connected')) return;
          selectedLeft = port;
          leftPorts.forEach(p => p.style.boxShadow = '');
          port.style.boxShadow = `0 0 15px ${port.dataset.color}`;
        });
      });

      rightPorts.forEach(port => {
        port.addEventListener('click', () => {
          if (!selectedLeft || port.classList.contains('connected')) return;
          if (selectedLeft.dataset.color === port.dataset.color) {
            port.classList.add('connected');
            selectedLeft.classList.add('connected');
            selectedLeft.style.boxShadow = '';
            connections++;
            if (connections >= totalConnections) {
              completeTask();
            }
          } else {
            port.style.animation = 'shake 0.3s';
            setTimeout(() => { port.style.animation = ''; }, 300);
          }
        });
      });

      const timer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          closeTaskOverlay();
        }
      }, 1000);
    }

    function createPasswordTask(container, timerEl) {
      let timeLeft = 20;
      const targetCode = '2049';
      let currentCode = ['0', '0', '0', '0'];

      const hint = document.createElement('div');
      hint.style.fontSize = '11px';
      hint.style.color = '#888';
      hint.style.marginBottom = '10px';
      hint.textContent = '提示: 未来年份密码';
      container.appendChild(hint);
      const lockContainer = document.createElement('div');
      lockContainer.className = 'password-lock';

      const wheels = [];
      for (let i = 0; i < 4; i++) {
        const wheel = document.createElement('div');
        wheel.className = 'digit-wheel';
        wheel.textContent = '0';
        wheel.addEventListener('click', () => {
          const current = parseInt(wheel.textContent);
          wheel.textContent = (current + 1) % 10;
          currentCode[i] = wheel.textContent;
          checkPassword();
        });
        lockContainer.appendChild(wheel);
        wheels.push(wheel);
      }

      container.appendChild(lockContainer);

      function checkPassword() {
        if (currentCode.join('') === targetCode) {
          completeTask();
        }
      }

      const timer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          closeTaskOverlay();
        }
      }, 1000);
    }

    function createCalibrateTask(container, timerEl) {
      let timeLeft = 15;
      let aligned = false;
      let alignTime = 0;

      const antennaContainer = document.createElement('div');
      antennaContainer.className = 'antenna-container';

      // 信号环
      for (let i = 1; i <= 4; i++) {
        const ring = document.createElement('div');
        ring.className = 'signal-ring';
        ring.style.width = (i * 50) + 'px';
        ring.style.height = (i * 50) + 'px';
        antennaContainer.appendChild(ring);
      }

      // 目标
      const target = document.createElement('div');
      target.className = 'antenna-target';
      let targetX = 100 + Math.random() * 50;
      let targetY = 100 + Math.random() * 50;
      target.style.left = targetX + 'px';
      target.style.top = targetY + 'px';
      antennaContainer.appendChild(target);

      // 准星
      const crosshair = document.createElement('div');
      crosshair.className = 'antenna-crosshair';
      let crossX = 125;
      let crossY = 125;
      crosshair.style.left = crossX + 'px';
      crosshair.style.top = crossY + 'px';
      antennaContainer.appendChild(crosshair);

      container.appendChild(antennaContainer);

      // 目标移动
      const targetInterval = setInterval(() => {
        targetX = 80 + Math.random() * 90;
        targetY = 80 + Math.random() * 90;
        target.style.left = targetX + 'px';
        target.style.top = targetY + 'px';
      }, 2000);

      // 拖动准星
      let dragging = false;
      crosshair.addEventListener('touchstart', (e) => {
        e.preventDefault();
        dragging = true;
      }, { passive: false });

      crosshair.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!dragging) return;
        const rect = antennaContainer.getBoundingClientRect();
        crossX = e.touches[0].clientX - rect.left - 15;
        crossY = e.touches[0].clientY - rect.top - 15;
        crossX = Math.max(0, Math.min(220, crossX));
        crossY = Math.max(0, Math.min(220, crossY));
        crosshair.style.left = crossX + 'px';
        crosshair.style.top = crossY + 'px';
      }, { passive: false });

      crosshair.addEventListener('touchend', () => {
        dragging = false;
      });

      // 对齐检测
      const alignInterval = setInterval(() => {
        const dist = Math.hypot(crossX - targetX, crossY - targetY);
        if (dist < 20) {
          alignTime += 0.1;
          if (alignTime >= 2) {
            clearInterval(targetInterval);
            clearInterval(alignInterval);
            completeTask();
          }
        } else {
          alignTime = 0;
        }
      }, 100);

      const timer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          clearInterval(targetInterval);
          clearInterval(alignInterval);
          closeTaskOverlay();
        }
      }, 1000);
    }

    function createUploadTask(container, timerEl) {
      let progress = 0;
      let timeLeft = 20;

      const uploadContainer = document.createElement('div');
      uploadContainer.className = 'upload-container';

      const bar = document.createElement('div');
      bar.className = 'upload-bar';
      uploadContainer.appendChild(bar);

      container.appendChild(uploadContainer);

      const status = document.createElement('div');
      status.style.marginTop = '10px';
      status.style.fontSize = '12px';
      status.textContent = '上传中... 点击红色干扰块';
      container.appendChild(status);

      // 自动增长
      const progressInterval = setInterval(() => {
        progress += 1;
        bar.style.width = progress + '%';
        if (progress >= 100) {
          clearInterval(progressInterval);
          clearInterval(interferenceInterval);
          completeTask();
        }
      }, 200);

      // 干扰块
      const interferences = [];
      const interferenceInterval = setInterval(() => {
        if (Math.random() < 0.4 && interferences.length < 3) {
          const interference = document.createElement('div');
          interference.className = 'interference';
          interference.style.left = (20 + Math.random() * 60) + '%';
          interference.addEventListener('click', () => {
            interference.remove();
            const idx = interferences.indexOf(interference);
            if (idx > -1) interferences.splice(idx, 1);
          });
          uploadContainer.appendChild(interference);
          interferences.push(interference);

          // 3秒后自动消失并回退进度
          setTimeout(() => {
            if (interference.parentNode) {
              progress = Math.max(0, progress - 10);
              bar.style.width = progress + '%';
              interference.remove();
            }
          }, 3000);
        }
      }, 1500);

      const timer = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          clearInterval(progressInterval);
          clearInterval(interferenceInterval);
          closeTaskOverlay();
        }
      }, 1000);
    }

    function completeTask() {
      if (gameState.currentTask) {
        socket.emit('task_complete', { taskId: gameState.currentTask.id });
      }
      closeTaskOverlay();
    }

    function closeTaskOverlay() {
      document.getElementById('taskOverlay').style.display = 'none';
      gameState.currentTask = null;
    }

    // ==================== 会议界面 ====================
    function showMeeting(data) {
      document.getElementById('meetingScreen').style.display = 'flex';
      document.getElementById('meetingTimer').textContent = data.duration;

      const title = document.getElementById('meetingTitle');
      if (data.reason === 'body_report') {
        title.textContent = '⚠️ 尸体被发现';
      } else if (data.reason === 'emergency') {
        title.textContent = '🚨 紧急会议';
      } else if (data.reason === 'auto_report') {
        title.textContent = '🔔 自动报告';
      }

      const list = document.getElementById('votingList');
      list.innerHTML = '';

      data.players.forEach(p => {
        const item = document.createElement('div');
        item.className = 'vote-item';

        const status = p.ghost ? '💀 幽灵' : p.eliminated ? '❌ 淘汰' : '🔋 存活';
        const canVote = gameState.alive && !gameState.ghost && !gameState.eliminated && !gameState.spectating && p.id !== gameState.playerId && p.alive && !p.ghost && !p.eliminated;

        item.innerHTML = `
          <span class="v-emoji">${p.emoji}</span>
          <span class="v-name">${p.name}</span>
          <span class="v-status">${status}</span>
        `;

        if (canVote) {
          const btn = document.createElement('button');
          btn.className = 'vote-btn';
          btn.textContent = '投票';
          btn.dataset.target = p.id;
          btn.addEventListener('click', () => {
            socket.emit('vote', { targetId: p.id });
            gameState.voted = true;
            document.querySelectorAll('.vote-btn').forEach(b => b.classList.add('voted'));
          });
          item.appendChild(btn);
        }

        list.appendChild(item);
      });

      // 跳过按钮
      const skipItem = document.createElement('div');
      skipItem.className = 'vote-item';
      skipItem.innerHTML = '<span class="v-name" style="flex:1;">跳过投票</span>';
      if (gameState.alive && !gameState.ghost && !gameState.eliminated && !gameState.spectating) {
        const skipBtn = document.createElement('button');
        skipBtn.className = 'vote-btn';
        skipBtn.textContent = '跳过';
        skipBtn.addEventListener('click', () => {
          socket.emit('vote', { targetId: null });
          gameState.voted = true;
          document.querySelectorAll('.vote-btn').forEach(b => b.classList.add('voted'));
        });
        skipItem.appendChild(skipBtn);
      }
      list.appendChild(skipItem);

      // 清空聊天
      document.getElementById('meetingChat').innerHTML = '';
      gameState.chatChannel = gameState.ghost ? 'ghost' : 'living';
    }

    function hideMeeting() {
      document.getElementById('meetingScreen').style.display = 'none';
    }

    document.getElementById('sendChatBtn').addEventListener('click', sendChat);
    document.getElementById('chatInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendChat();
    });

    function sendChat() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      socket.emit('chat_message', { message: msg });
      input.value = '';
    }

    function addChatMessage(data) {
      const chat = document.getElementById('meetingChat');
      const div = document.createElement('div');
      div.className = 'chat-msg' + (data.channel === 'ghost' ? ' ghost' : '');
      div.innerHTML = `<span class="chat-name">${data.playerName}:</span> ${data.message}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // ==================== 能力菜单 ====================
    function showAbilityMenu() {
      if (!gameState.companion) return;

      const companion = gameState.companion;
      const isImpostor = gameState.role === 'impostor';
      const isTactical = gameState.gamePhase === 'tactical';

      let options = [];

      // 根据伙伴和身份添加能力选项
      if (companion.id === 'nightingale') {
        if (!isImpostor && isTactical && gameState.charge >= 2) {
          options.push({ name: '反制诅咒', cost: 2, action: 'anti_curse' });
        }
      } else if (companion.id === 'pugelisi') {
        if (isTactical && !gameState.resurrectUsed) {
          options.push({ name: '复活', action: 'resurrect' });
        }
      } else if (companion.id === 'gouwen') {
        if (!isImpostor && isTactical && gameState.charge >= 1) {
          options.push({ name: '疾步', cost: 1, action: 'speed_boost' });
        }
      } else if (companion.id === 'yuyu') {
        if (!gameState.summonUsed) {
          options.push({ name: '召唤伙伴', action: 'summon' });
        }
        if (isImpostor && isTactical && !gameState.controlAttackUsed) {
          options.push({ name: '控制袭击', action: 'control_attack' });
        }
        if (!isImpostor && gameState.charge >= 2 && (gameState.remoteTaskUses || 0) < 2) {
          options.push({ name: '远程任务', cost: 2, action: 'remote_task' });
        }
      } else if (companion.id === 'hewal') {
        if (isImpostor && isTactical && (gameState.invisUses || 0) < 3) {
          options.push({ name: '隐身', action: 'invis' });
        }
        if (!isImpostor && isTactical && gameState.charge >= 3) {
          options.push({ name: '查验', cost: 3, action: 'inspect' });
        }
      } else if (companion.id === 'xiu') {
        if (isImpostor && isTactical) {
          options.push({ name: '诅咒', action: 'curse' });
        }
      } else if (companion.id === 'luolan') {
        options.push({ name: '管道感知', action: 'vent_sense' });
      } else if (companion.id === 'yuansheng') {
        if (isImpostor && isTactical && !gameState.trapPlaced) {
          options.push({ name: '布置陷阱', action: 'trap' });
        }
      } else if (companion.id === 'fengye') {
        if (isTactical && gameState.charge >= 2) {
          options.push({ name: '时间暂停', cost: 2, action: 'time_stop' });
        }
      } else if (companion.id === 'yezhu') {
        if (isImpostor && isTactical) {
          options.push({ name: '伪装', action: 'disguise' });
        }
      }

      if (options.length === 0) {
        showToast('当前无可用的能力');
        return;
      }

      // 创建能力选择弹窗
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:350;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'cyber-btn';
        btn.textContent = opt.name + (opt.cost ? ` (${opt.cost}🔋)` : '');
        btn.addEventListener('click', () => {
          if (opt.action === 'disguise' || opt.action === 'curse' || opt.action === 'control_attack' || opt.action === 'inspect') {
            // 需要选择目标
            showTargetSelection(opt.action);
          } else {
            socket.emit('use_ability', { type: opt.action });
          }
          overlay.remove();
        });
        overlay.appendChild(btn);
      });

      const cancel = document.createElement('button');
      cancel.className = 'cyber-btn red';
      cancel.textContent = '取消';
      cancel.addEventListener('click', () => overlay.remove());
      overlay.appendChild(cancel);

      document.body.appendChild(overlay);
    }

    function showTargetSelection(action) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:360;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px;';

      const title = document.createElement('div');
      title.style.cssText = 'font-size:18px;color:#00f0ff;margin-bottom:10px;';
      title.textContent = '选择目标';
      overlay.appendChild(title);

      gameState.players.forEach(p => {
        if (p.id === gameState.playerId) return;
        if (!p.alive || p.ghost || p.eliminated) return;

        const btn = document.createElement('button');
        btn.className = 'cyber-btn';
        btn.style.width = '200px';
        btn.innerHTML = `<span style="font-size:20px;margin-right:8px;">${p.emoji}</span>${p.name}`;
        btn.addEventListener('click', () => {
          socket.emit('use_ability', { type: action, targetId: p.id });
          overlay.remove();
        });
        overlay.appendChild(btn);
      });

      const cancel = document.createElement('button');
      cancel.className = 'cyber-btn red';
      cancel.textContent = '取消';
      cancel.addEventListener('click', () => overlay.remove());
      overlay.appendChild(cancel);

      document.body.appendChild(overlay);
    }

    // ==================== 破坏菜单 ====================
    function showSabotageMenu() {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:350;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;';

      const title = document.createElement('div');
      title.style.cssText = 'font-size:24px;color:#ff3131;text-shadow:0 0 20px #ff3131;';
      title.textContent = '⚡ 系统破坏';
      overlay.appendChild(title);

      const elecBtn = document.createElement('button');
      elecBtn.className = 'cyber-btn';
      elecBtn.textContent = '🔌 电力破坏';
      elecBtn.addEventListener('click', () => {
        socket.emit('sabotage', { type: 'electrical' });
        overlay.remove();
      });
      overlay.appendChild(elecBtn);

      const o2Btn = document.createElement('button');
      o2Btn.className = 'cyber-btn';
      o2Btn.textContent = '🫁 供氧破坏';
      o2Btn.addEventListener('click', () => {
        socket.emit('sabotage', { type: 'o2' });
        overlay.remove();
      });
      overlay.appendChild(o2Btn);

      const cancel = document.createElement('button');
      cancel.className = 'cyber-btn red';
      cancel.textContent = '取消';
      cancel.addEventListener('click', () => overlay.remove());
      overlay.appendChild(cancel);

      document.body.appendChild(overlay);
    }

    // ==================== 管道地图 ====================
    function showVentMap() {
      const overlay = document.getElementById('ventMap');
      const grid = document.getElementById('ventGrid');
      grid.innerHTML = '';

      if (!gameState.map || !gameState.map.vents) return;

      gameState.map.vents.forEach(vent => {
        const btn = document.createElement('div');
        btn.className = 'vent-option';
        btn.textContent = '🚇';
        btn.addEventListener('click', () => {
          socket.emit('use_vent', { targetVentId: vent.id });
          overlay.style.display = 'none';
        });
        grid.appendChild(btn);
      });

      overlay.style.display = 'flex';
    }

    // ==================== 放逐界面 ====================
    function showEjectedScreen() {
      document.getElementById('ejectedScreen').style.display = 'flex';
      let countdown = 10;
      const el = document.getElementById('ejectCountdown');
      el.textContent = countdown;

      const timer = setInterval(() => {
        countdown--;
        el.textContent = countdown;
        if (countdown <= 0) {
          clearInterval(timer);
          enterSpectate();
        }
      }, 1000);

      document.getElementById('btnSpectate').onclick = () => {
        clearInterval(timer);
        enterSpectate();
      };

      document.getElementById('btnLeave').onclick = () => {
        clearInterval(timer);
        socket.emit('spectate_choice', { choice: 'leave' });
        location.reload();
      };
    }

    function enterSpectate() {
      document.getElementById('ejectedScreen').style.display = 'none';
      document.getElementById('spectateScreen').style.display = 'block';
      gameState.spectating = true;
      gameState.ghost = false;
      gameState.alive = false;
      socket.emit('spectate_choice', { choice: 'spectate' });

      // 观战模式：自由相机
      let dragStart = null;
      let camOffsetX = 0;
      let camOffsetY = 0;

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (dragStart && e.touches.length === 1) {
          const dx = e.touches[0].clientX - dragStart.x;
          const dy = e.touches[0].clientY - dragStart.y;
          camOffsetX += dx / gameState.zoom;
          camOffsetY += dy / gameState.zoom;
          dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
      }, { passive: true });

      canvas.addEventListener('touchend', () => {
        dragStart = null;
      }, { passive: true });

      // 覆盖相机更新
      const originalRender = render;
      render = function() {
        ctx.fillStyle = COLORS.dark;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.scale(gameState.zoom, gameState.zoom);
        ctx.translate(-gameState.cameraX + camOffsetX, -gameState.cameraY + camOffsetY);

        drawGrid();
        if (gameState.map) {
          drawRooms();
          drawCorridors();
          drawDecorations();
          drawTasks();
          drawVents();
          drawTraps();
          drawEffects();
          drawPlayers();
          drawEmergencyButton();
        }

        ctx.restore();
      };
    }

    document.getElementById('btnExitSpectate').addEventListener('click', () => {
      socket.emit('spectate_choice', { choice: 'leave' });
      location.reload();
    });


    // ==================== 游戏结束 ====================
    function showGameEnd(data) {
      const screen = document.getElementById('gameEndScreen');
      const text = document.getElementById('winnerText');
      const reason = document.getElementById('endReason');

      screen.style.display = 'flex';

      if (data.winner === 'impostor') {
        text.textContent = '内鬼胜利';
        text.className = 'winner-text winner-impostor';
      } else {
        text.textContent = '船员胜利';
        text.className = 'winner-text winner-crew';
      }

      const reasons = {
        'tasks_completed': '所有任务已完成',
        'impostors_eliminated': '所有内鬼已被找出',
        'numbers': '内鬼人数占优',
        'oxygen_depleted': '氧气耗尽'
      };
      reason.textContent = reasons[data.reason] || data.reason;
    }

    // ==================== 氧气倒计时 ====================
    function startOxygenTimer(duration) {
      const el = document.getElementById('oxygenTimer');
      let timeLeft = duration;

      const timer = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        el.textContent = `🫁 ${mins}:${secs.toString().padStart(2, '0')}`;

        if (timeLeft <= 0 || !gameState.sabotages.o2) {
          clearInterval(timer);
          el.style.display = 'none';
        }
      }, 1000);
    }

    // ==================== 任务面板 ====================
    function updateTaskPanel() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      if (gameState.role === 'impostor') {
        const fake = document.createElement('div');
        fake.className = 'task-item';
        fake.innerHTML = '<span>❓</span><span>未知任务</span>';
        list.appendChild(fake);
        return;
      }

      gameState.tasks.forEach(task => {
        const item = document.createElement('div');
        item.className = 'task-item' + (task.completed ? ' done' : '');
        const icon = task.completed ? '✅' : '🔷';
        const roomName = gameState.map?.rooms?.find(r => r.id === task.roomId)?.name || '未知';
        item.innerHTML = `<span>${icon}</span><span>${roomName}·${getTaskName(task.type)}</span>${!task.completed ? '<span class="task-arrow">➜</span>' : ''}`;
        list.appendChild(item);
      });

      document.getElementById('chargeDisplay').textContent = `🔋 × ${gameState.charge}/3`;
    }

    document.getElementById('taskHeader').addEventListener('click', () => {
      document.getElementById('taskPanel').classList.toggle('collapsed');
    });

    // ==================== 内鬼聊天 ====================
    document.getElementById('impostorChatInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const input = document.getElementById('impostorChatInput');
        const msg = input.value.trim();
        if (msg) {
          socket.emit('chat_message', { message: msg });
          input.value = '';
        }
      }
    });

    // ==================== 工具函数 ====================
    function showToast(message) {
      const toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);border:1px solid #00f0ff;color:#00f0ff;padding:10px 20px;border-radius:4px;font-family:Orbitron,monospace;font-size:12px;z-index:500;box-shadow:0 0 15px rgba(0,240,255,0.3);animation:fadeInOut 2s forwards;';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }

    function resetGame() {
      gameState = {
        roomCode: null, playerId: null, playerName: '',
        role: null, companion: null, tasks: [], charge: 0,
        alive: true, ghost: false, eliminated: false, spectating: false,
        inVent: false, map: null, players: new Map(),
        myX: 1200, myY: 950, cameraX: 0, cameraY: 0, zoom: 1,
        minimapZoom: 0.08, killCooldown: 0, ventCooldown: 0,
        sabotageCooldown: 0, voted: false, currentTask: null,
        effects: [], traps: [], sabotages: {}, chatChannel: 'living',
        isGhostChat: false, gamePhase: 'lobby', barrierActive: false,
        cursed: false, invisible: false, controlled: false,
        speedMultiplier: 1, injured: false, weak: false,
        antiCurse: false, resurrected: false, silenced: false,
        remoteTaskUses: 0, invisUses: 0, trapPlaced: false,
        controlAttackUsed: false, summonUsed: false,
        barrierUsed: false, deathTransferUsed: false,
        disguiseTarget: null, disguised: false,
        ventReadout: 0, emergencyUsed: 0, animTime: 0
      };

      document.getElementById('ghostIndicator').style.display = 'none';
      document.getElementById('controlWarning').style.display = 'none';
      document.getElementById('sabotageAlert').style.display = 'none';
      document.getElementById('oxygenTimer').style.display = 'none';
      document.getElementById('impostorChat').style.display = 'none';
      document.getElementById('btnKill').style.display = 'none';
      document.getElementById('btnVent').style.display = 'none';
      document.getElementById('btnSabotage').style.display = 'none';
    }

    // ==================== 键盘控制（桌面端备用） ====================
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      updateKeyboardMovement();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
      updateKeyboardMovement();
    });

    function updateKeyboardMovement() {
      let vx = 0, vy = 0;
      if (keys['w'] || keys['ArrowUp']) vy = -1;
      if (keys['s'] || keys['ArrowDown']) vy = 1;
      if (keys['a'] || keys['ArrowLeft']) vx = -1;
      if (keys['d'] || keys['ArrowRight']) vx = 1;

      if (vx !== 0 || vy !== 0) {
        const len = Math.hypot(vx, vy);
        vx /= len; vy /= len;
      }

      socket.emit('move', { vx, vy });
    }

    // CSS动画
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fadeInOut {
        0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        20% { opacity: 1; transform: translateX(-50%) translateY(0); }
        80% { opacity: 1; transform: translateX(-50%) translateY(0); }
        100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
