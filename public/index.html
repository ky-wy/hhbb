<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博伙伴 · Among Us 变体</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Orbitron', 'Microsoft YaHei', 'PingFang SC', monospace;
            color: #00f0ff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: block;
        }
        .glass-panel {
            background: rgba(10,10,10,0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0,240,255,0.4);
            box-shadow: 0 0 15px rgba(0,240,255,0.3);
            border-radius: 12px;
            padding: 20px;
        }
        .neon-input {
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(0,240,255,0.6);
            color: #00f0ff;
            padding: 12px 18px;
            font-family: 'Orbitron', monospace;
            border-radius: 8px;
            outline: none;
            box-shadow: 0 0 10px rgba(0,240,255,0.3);
        }
        .neon-btn {
            background: rgba(0,240,255,0.1);
            border: 1px solid rgba(0,240,255,0.7);
            color: #00f0ff;
            padding: 12px 24px;
            font-family: 'Orbitron', monospace;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0,240,255,0.4);
            transition: all 0.3s;
        }
        .neon-btn:active {
            background: rgba(0,240,255,0.3);
            box-shadow: 0 0 20px rgba(0,240,255,0.8);
        }
        .lobby-screen {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            z-index: 10;
            text-align: center;
        }
        .hidden { display: none !important; }
        #hud {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        #joystick-area {
            position: absolute;
            bottom: 40px; left: 40px;
            width: 120px; height: 120px;
            pointer-events: auto;
            z-index: 20;
        }
        #action-buttons {
            position: absolute;
            bottom: 40px; right: 40px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            z-index: 20;
        }
        .action-btn {
            width: 70px; height: 70px;
            border-radius: 50%;
            border: 2px solid rgba(0,240,255,0.8);
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,240,255,0.5);
        }
        .action-btn.impostor {
            border-color: #ff3131;
            box-shadow: 0 0 15px rgba(255,49,49,0.6);
        }
        #minimap {
            position: absolute;
            top: 20px; right: 20px;
            width: 120px; height: 120px;
            border: 2px solid rgba(0,240,255,0.6);
            border-radius: 50%;
            background: rgba(10,10,10,0.7);
            z-index: 15;
            pointer-events: auto;
            overflow: hidden;
        }
        #task-panel {
            position: absolute;
            top: 20px; left: 20px;
            width: 220px;
            z-index: 15;
            pointer-events: auto;
            font-size: 12px;
            color: #00f0ff;
        }
        .task-item { margin: 5px 0; }
        .task-done { text-decoration: line-through; color: #00ff00; }
        #meeting-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #chat-area {
            width: 90%;
            max-width: 500px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0,240,255,0.4);
        }
        .chat-msg { margin: 4px 0; }
        .ghost-msg { color: rgba(200,100,255,0.8); }
        #chat-input-area {
            display: flex;
            width: 90%;
            max-width: 500px;
            gap: 10px;
        }
        #qte-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: rgba(0,0,0,0.9);
            border: 1px solid #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #spectate-choice {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div id="lobby-screen" class="glass-panel lobby-screen">
            <h1 style="color:#ff00ff; text-shadow:0 0 10px #ff00ff;">CYBER CREW</h1>
            <input id="name-input" class="neon-input" placeholder="输入昵称" value="Player">
            <button id="create-room-btn" class="neon-btn">创建房间</button>
            <input id="room-id-input" class="neon-input" placeholder="6位房间号" maxlength="6">
            <button id="join-room-btn" class="neon-btn">加入房间</button>
            <div id="lobby-info"></div>
        </div>

        <div id="partner-select" class="glass-panel hidden" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:25; text-align:center;">
            <h2>选择伙伴</h2>
            <div id="partner-list" style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px;"></div>
        </div>

        <div id="task-panel" class="glass-panel hidden">
            <div style="display:flex; justify-content:space-between;">
                <span>📋 任务</span>
                <span id="task-collapse" style="cursor:pointer;">−</span>
            </div>
            <div id="task-list"></div>
            <div id="charge-display">🔋×0/3</div>
            <div>公共任务: <span id="public-progress">0/0</span></div>
        </div>

        <div id="minimap">
            <canvas id="minimap-canvas" width="120" height="120"></canvas>
        </div>

        <div id="joystick-area">
            <canvas id="joystick-canvas" width="120" height="120"></canvas>
        </div>

        <div id="action-buttons">
            <button id="btn-task" class="action-btn">📋</button>
            <button id="btn-report" class="action-btn">📢</button>
            <button id="btn-ability" class="action-btn">✨</button>
            <button id="btn-kill" class="action-btn impostor hidden">🗡️</button>
            <button id="btn-vent" class="action-btn impostor hidden">🚇</button>
            <button id="btn-sabotage" class="action-btn impostor hidden">⚡</button>
            <button id="btn-impostor-chat" class="action-btn impostor hidden">👥</button>
        </div>

        <div id="meeting-overlay" class="hidden">
            <div class="glass-panel" style="width:90%; max-width:600px;">
                <h2>紧急会议</h2>
                <div id="meeting-players"></div>
                <div id="chat-area"></div>
                <div id="chat-input-area">
                    <input id="chat-input" class="neon-input" placeholder="输入消息..." style="flex:1;">
                    <button id="send-chat" class="neon-btn">发送</button>
                </div>
                <button id="vote-skip" class="neon-btn">跳过投票</button>
            </div>
        </div>

        <div id="qte-overlay" class="hidden"></div>

        <div id="spectate-choice" class="glass-panel hidden">
            <h2>⚡ 你已被放逐 ⚡</h2>
            <button id="spectate-btn" class="neon-btn">👁️ 观战</button>
            <button id="exit-btn" class="neon-btn" style="border-color:#ff3131; color:#ff3131;">🚪 退出房间</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ==================== 全局状态 ====================
        const socket = io();
        let roomId = null;
        let myId = null;
        let myName = '';
        let myRole = null;
        let myPartnerId = null;
        let myPartnerName = '';
        let gameState = 'lobby'; // lobby, selecting, playing, meeting, ended
        let players = {}; // socketId -> {name, position, role, alive, partnerId, partnerName?, visibilityState, ...}
        let myPosition = { x: 500, y: 350 };
        let myTasks = [];
        let publicTasks = [];
        let taskProgress = [];
        let chargePoints = 0;
        let totalPublicTasks = 0;
        let publicTaskProgress = 0;
        let meetingActive = false;
        let myAlive = true;
        let mySpectating = false;
        let isImpostor = false;
        let killCooldown = 0;
        let joystickActive = false;
        let joystickVec = { x: 0, y: 0 };
        let canvas, ctx, minimapCanvas, minimapCtx, joystickCanvas, joystickCtx;
        let mapOffset = { x: 0, y: 0 };
        let zoom = 1;
        let targetZoom = 1;
        let lastPinchDist = 0;
        let touchId = null;
        let qteActive = false;
        let currentQte = null;
        let abilities = {}; // 存储伙伴能力配置
        let myCooldowns = {};
        let usedAbilities = {};

        // ==================== 地图数据 ====================
        const ROOMS = [
            { id: 'cafeteria', name: '餐厅', x: 350, y: 300, w: 300, h: 200, color: '#00f0ff', items: ['table', 'chairs', 'menu'] },
            { id: 'weapons', name: '武器舱', x: 50, y: 100, w: 200, h: 150, color: '#ff00ff', items: ['weaponrack', 'ammo'] },
            { id: 'oxygen', name: '氧气舱', x: 750, y: 100, w: 200, h: 150, color: '#b300ff', items: ['o2tank', 'pipe', 'gauge'] },
            { id: 'navigation', name: '驾驶舱', x: 750, y: 450, w: 200, h: 150, color: '#00f0ff', items: ['seat', 'joystick', 'starmap'] },
            { id: 'electrical', name: '电力间', x: 50, y: 450, w: 200, h: 150, color: '#ff3131', items: ['electricbox', 'cable', 'panel'] },
            { id: 'medbay', name: '医疗间', x: 50, y: 300, w: 200, h: 150, color: '#00f0ff', items: ['scanbed', 'cabinet', 'hologram'] },
            { id: 'storage', name: '仓库', x: 350, y: 100, w: 200, h: 150, color: '#ff00ff', items: ['shelf', 'box', 'junk'] },
            { id: 'admin', name: '主控台', x: 350, y: 450, w: 200, h: 150, color: '#b300ff', items: ['screen', 'console'] },
        ];
        const VENTS = [
            { id: 'vent1', x: 150, y: 200 },
            { id: 'vent2', x: 850, y: 200 },
            { id: 'vent3', x: 150, y: 500 },
            { id: 'vent4', x: 850, y: 500 },
            { id: 'vent5', x: 500, y: 100 },
            { id: 'vent6', x: 500, y: 600 },
        ];
        const EMERGENCY_BUTTON_POS = { x: 500, y: 350 };

        // ==================== 伙伴能力配置（前端展示用） ====================
        const PARTNER_INFO = {
            nightingale: { name: '夜莺', icon: '🌙' },
            pugelisi: { name: '普格里斯', icon: '🛡️' },
            gouwen: { name: '钩吻', icon: '🐍' },
            yuyu: { name: '虞瑜', icon: '🧿' },
            hewal: { name: '赫瓦尔', icon: '👤' },
            xiu: { name: '修', icon: '⚔️' },
            luolan: { name: '洛兰', icon: '📡' },
            yuansheng: { name: '渊生', icon: '🕳️' },
            fengye: { name: '风夜', icon: '⏳' },
            yezhu: { name: '夜主', icon: '🎭' },
        };

        // ==================== 初始化 ====================
        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');
            joystickCanvas = document.getElementById('joystick-canvas');
            joystickCtx = joystickCanvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setupEventListeners();
            gameLoop();
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // ==================== 事件监听 ====================
        function setupEventListeners() {
            document.getElementById('create-room-btn').onclick = () => {
                myName = document.getElementById('name-input').value || 'Player';
                socket.emit('create_room', { name: myName });
            };
            document.getElementById('join-room-btn').onclick = () => {
                myName = document.getElementById('name-input').value || 'Player';
                const rid = document.getElementById('room-id-input').value.trim();
                if (rid.length === 6) socket.emit('join_room', { roomId: rid, name: myName });
            };
            document.getElementById('btn-task').onclick = () => {
                if (gameState === 'playing' && myRole === 'crew' && myAlive && !mySpectating) {
                    // 打开任务面板
                    document.getElementById('task-panel').classList.toggle('hidden');
                }
            };
            document.getElementById('btn-report').onclick = () => {
                if (gameState === 'playing' && myAlive && !mySpectating) {
                    socket.emit('report_body');
                }
            };
            document.getElementById('btn-ability').onclick = () => {
                if (gameState === 'playing' && myAlive && !mySpectating) {
                    // 根据伙伴显示能力菜单
                    showAbilityMenu();
                }
            };
            document.getElementById('btn-kill').onclick = () => {
                if (gameState === 'playing' && isImpostor && myAlive && !mySpectating) {
                    // 检查冷却
                    if (Date.now() >= killCooldown) {
                        // 寻找目标
                        const target = findNearestAlivePlayer(40);
                        if (target) {
                            socket.emit('ability_use', { abilityType: 'kill', targetId: target.socketId });
                        }
                    }
                }
            };
            document.getElementById('btn-vent').onclick = () => {
                if (gameState === 'playing' && isImpostor && myAlive && !mySpectating) {
                    showVentMenu();
                }
            };
            document.getElementById('btn-sabotage').onclick = () => {
                if (gameState === 'playing' && isImpostor && myAlive && !mySpectating) {
                    showSabotageMenu();
                }
            };
            document.getElementById('btn-impostor-chat').onclick = () => {
                // 切换内鬼聊天窗口
            };
            document.getElementById('send-chat').onclick = sendChat;
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendChat();
            });
            document.getElementById('vote-skip').onclick = () => {
                if (meetingActive && myAlive && !mySpectating) {
                    socket.emit('vote_cast', { targetId: 'skip' });
                }
            };
            // 摇杆触摸
            joystickCanvas.addEventListener('touchstart', handleJoystickStart);
            joystickCanvas.addEventListener('touchmove', handleJoystickMove);
            joystickCanvas.addEventListener('touchend', handleJoystickEnd);
            joystickCanvas.addEventListener('mousedown', handleJoystickStart);
            joystickCanvas.addEventListener('mousemove', handleJoystickMove);
            joystickCanvas.addEventListener('mouseup', handleJoystickEnd);
            // 缩放
            canvas.addEventListener('touchstart', handleCanvasTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleCanvasTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleCanvasTouchEnd);
            // 观战选择
            document.getElementById('spectate-btn').onclick = () => {
                socket.emit('spectate_choice', { choice: 'spectate' });
                document.getElementById('spectate-choice').classList.add('hidden');
            };
            document.getElementById('exit-btn').onclick = () => {
                socket.emit('spectate_choice', { choice: 'exit' });
                document.getElementById('spectate-choice').classList.add('hidden');
                // 返回大厅
                showLobby();
            };
        }

         // 摇杆触摸
            joystickCanvas.addEventListener('touchstart', handleJoystickStart);
            joystickCanvas.addEventListener('touchmove', handleJoystickMove);
            joystickCanvas.addEventListener('touchend', handleJoystickEnd);
            joystickCanvas.addEventListener('mousedown', handleJoystickStart);
            joystickCanvas.addEventListener('mousemove', handleJoystickMove);
            joystickCanvas.addEventListener('mouseup', handleJoystickEnd);
            // 缩放
            canvas.addEventListener('touchstart', handleCanvasTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleCanvasTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleCanvasTouchEnd);
            // 观战选择
            document.getElementById('spectate-btn').onclick = () => {
                socket.emit('spectate_choice', { choice: 'spectate' });
                document.getElementById('spectate-choice').classList.add('hidden');
            };
            document.getElementById('exit-btn').onclick = () => {
                socket.emit('spectate_choice', { choice: 'exit' });
                document.getElementById('spectate-choice').classList.add('hidden');
                // 返回大厅
                showLobby();
            };
        }

        // ==================== 摇杆处理 ====================
        function handleJoystickStart(e) {
            e.preventDefault();
            joystickActive = true;
            touchId = e.touches ? e.touches[0].identifier : null;
            updateJoystick(e);
        }
        function handleJoystickMove(e) {
            if (joystickActive) updateJoystick(e);
        }
        function handleJoystickEnd(e) {
            joystickActive = false;
            joystickVec = { x: 0, y: 0 };
            drawJoystick();
        }
        function updateJoystick(e) {
            const rect = joystickCanvas.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let clientX, clientY;
            if (e.touches) {
                const touch = Array.from(e.touches).find(t => t.identifier === touchId) || e.touches[0];
                clientX = touch.clientX;
                clientY = touch.clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let dx = clientX - cx;
            let dy = clientY - cy;
            const maxDist = 50;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxDist) {
                dx = dx / dist * maxDist;
                dy = dy / dist * maxDist;
            }
            joystickVec = { x: dx / maxDist, y: dy / maxDist };
            drawJoystick();
        }
        function drawJoystick() {
            joystickCtx.clearRect(0, 0, joystickCanvas.width, joystickCanvas.height);
            joystickCtx.beginPath();
            joystickCtx.arc(60, 60, 50, 0, Math.PI * 2);
            joystickCtx.strokeStyle = '#00f0ff';
            joystickCtx.lineWidth = 3;
            joystickCtx.shadowBlur = 10;
            joystickCtx.shadowColor = '#00f0ff';
            joystickCtx.stroke();
            joystickCtx.beginPath();
            joystickCtx.arc(60 + joystickVec.x * 30, 60 + joystickVec.y * 30, 20, 0, Math.PI * 2);
            joystickCtx.fillStyle = '#ff00ff';
            joystickCtx.shadowBlur = 10;
            joystickCtx.shadowColor = '#ff00ff';
            joystickCtx.fill();
        }

        // ==================== 缩放处理 ====================
        function handleCanvasTouchStart(e) {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastPinchDist = Math.sqrt(dx*dx + dy*dy);
            }
        }
        function handleCanvasTouchMove(e) {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const scale = dist / lastPinchDist;
                lastPinchDist = dist;
                zoom = Math.min(2, Math.max(0.5, zoom * scale));
                targetZoom = zoom;
            }
        }
        function handleCanvasTouchEnd(e) {
            // 无
        }

        // ==================== Socket 事件 ====================
        socket.on('room_created', (data) => {
            roomId = data.roomId;
            myId = data.playerId;
            gameState = 'selecting';
            document.getElementById('lobby-screen').classList.add('hidden');
            showPartnerSelect();
        });
        socket.on('join_success', (data) => {
            roomId = data.roomId;
            myId = data.playerId;
            gameState = 'lobby';
            document.getElementById('lobby-screen').classList.add('hidden');
            showLobbyWaiting(data.players);
        });
        socket.on('join_error', (data) => {
            alert(data.message);
        });
        socket.on('player_joined', (data) => {
            // 更新大厅列表
        });
        socket.on('player_left', (data) => {
            delete players[data.socketId];
            updateLobbyPlayerList();
        });
        socket.on('partner_update', (data) => {
            myPartnerId = data.partnerId;
            myPartnerName = data.name;
            document.getElementById('partner-select').classList.add('hidden');
            if (gameState === 'selecting') {
                // 等待开始
            }
        });
        socket.on('partner_selected', (data) => {
            // 更新大厅显示
        });
        socket.on('partner_error', (data) => {
            alert(data.message);
        });
        socket.on('start_error', (data) => {
            alert(data.message);
        });
        socket.on('game_start', (data) => {
            myId = data.selfId;
            myRole = data.role;
            myPartnerId = data.partnerId;
            myPartnerName = data.partnerName;
            isImpostor = myRole === 'impostor';
            players = {};
            for (const [sid, info] of Object.entries(data.players)) {
                players[sid] = {
                    socketId: sid,
                    name: info.partnerId ? PARTNER_INFO[info.partnerId]?.name || '玩家' : '玩家',
                    partnerId: info.partnerId,
                    partnerName: sid === myId ? myPartnerName : undefined,
                    position: { x: 500, y: 350 },
                    role: null,
                    alive: true,
                    visibilityState: 'normal',
                };
            }
            myTasks = data.tasks || [];
            publicTasks = data.publicTasks || [];
            totalPublicTasks = data.totalPublicTasks;
            publicTaskProgress = 0;
            chargePoints = 0;
            myAlive = true;
            mySpectating = false;
            gameState = 'playing';
            document.getElementById('task-panel').classList.remove('hidden');
            if (isImpostor) {
                document.getElementById('btn-kill').classList.remove('hidden');
                document.getElementById('btn-vent').classList.remove('hidden');
                document.getElementById('btn-sabotage').classList.remove('hidden');
                document.getElementById('btn-impostor-chat').classList.remove('hidden');
                document.getElementById('btn-task').classList.add('hidden');
            } else {
                document.getElementById('btn-kill').classList.add('hidden');
                document.getElementById('btn-vent').classList.add('hidden');
                document.getElementById('btn-sabotage').classList.add('hidden');
                document.getElementById('btn-impostor-chat').classList.add('hidden');
                document.getElementById('btn-task').classList.remove('hidden');
            }
            updateTaskPanel();
            hideLobby();
        });
        socket.on('player_moved', (data) => {
            if (players[data.socketId]) {
                players[data.socketId].position = data.position;
            }
        });
        socket.on('player_died', (data) => {
            if (players[data.playerId]) {
                players[data.playerId].alive = false;
            }
            if (data.playerId === myId) {
                myAlive = false;
                showGhostUI();
            }
        });
        socket.on('effect_trigger', (data) => {
            handleEffect(data);
        });
        socket.on('meeting_start', (data) => {
            meetingActive = true;
            gameState = 'meeting';
            document.getElementById('meeting-overlay').classList.remove('hidden');
            document.getElementById('chat-area').innerHTML = '';
            updateMeetingPlayers();
        });
        socket.on('chat_message', (data) => {
            if (data.channel === 'ghost' && !myAlive) {
                addChatMessage(data, true);
            } else if (data.channel === 'living' && myAlive) {
                addChatMessage(data, false);
            }
        });
        socket.on('vote_update', (data) => {
            // 显示投票状态
        });
        socket.on('vote_result', (data) => {
            meetingActive = false;
            if (data.ejectedId === myId) {
                // 我被放逐
                mySpectating = true;
                showSpectateChoice();
            }
            setTimeout(() => {
                document.getElementById('meeting-overlay').classList.add('hidden');
                if (data.ejectedId && players[data.ejectedId]) {
                    players[data.ejectedId].alive = false;
                }
                if (myRole === 'crew' && data.ejectedId === myId) {
                    // 已处理
                }
                gameState = 'playing';
            }, 3000);
        });
        socket.on('game_over', (data) => {
            gameState = 'ended';
            alert(`游戏结束！${data.winner === 'impostor' ? '内鬼' : '船员'}胜利！`);
            setTimeout(() => {
                location.reload();
            }, 3000);
        });
        socket.on('sabotage_effect', (data) => {
            if (data.system === 'power') {
                // 电力破坏
            } else if (data.system === 'oxygen') {
                // 氧气破坏
                if (data.active) startOxygenCountdown(data.timeLeft);
            }
        });
        socket.on('controlled', (data) => {
            // 被控制
            alert('系统入侵：你的身体被控制！');
        });
        socket.on('check_result', (data) => {
            alert(`目标阵营：${data.role === 'impostor' ? '内鬼' : '船员'}`);
        });
        socket.on('spectate_start', () => {
            mySpectating = true;
            showSpectateUI();
        });
        socket.on('ejected_choice', () => {
            showSpectateChoice();
        });

        // ==================== UI 更新函数 ====================

                btn.className = 'neon-btn';
                btn.textContent = `${info.icon} ${info.name}`;
                btn.onclick = () => {
                    socket.emit('select_partner', { partnerId: pid });
                };
                list.appendChild(btn);
            }
        }
        function showLobbyWaiting(playerList) {

            div.style.position = 'absolute';

            div.style.left = '50%';
            div.style.transform = 'translate(-50%,-50%)';

        function updateLobbyPlayerList() {

        function showSpectateChoice() {
            document.getElementById('spectate-choice').classList.remove('hidden');

        function showSpectateUI() {
            // 观战模式
        }
        function addChatMessage(msg, isGhost) {
            const area = document.getElementById('chat-area');
            const div = document.createElement('div');
            div.className = 'chat-msg' + (isGhost ? ' ghost-msg' : '');
            div.textContent = `${msg.name}: ${msg.text}`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }
        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text) {
                socket.emit('chat_message', { text });
                input.value = '';
            }
        }
        function updateMeetingPlayers() {
            const container = document.getElementById('meeting-players');
            container.innerHTML = '';
            for (const p of Object.values(players)) {
                if (p.alive && !p.spectating) {
                    const div = document.createElement('div');
                    div.style.display = 'flex';
                    div.style.alignItems = 'center';
                    div.style.justifyContent = 'space-between';
                    div.style.margin = '5px 0';
                    div.innerHTML = `<span>${p.name}</span>`;
                    const voteBtn = document.createElement('button');
                    voteBtn.className = 'neon-btn';
                    voteBtn.textContent = '投票';
                    voteBtn.onclick = () => {
                        socket.emit('vote_cast', { targetId: p.socketId });
                    };
                    if (myAlive && !mySpectating) {
                        div.appendChild(voteBtn);
                    }
                    container.appendChild(div);
                }
            }
        }
        function updateTaskPanel() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            if (myRole === 'crew') {
                myTasks.forEach(task => {
                    const div = document.createElement('div');
                    div.className = 'task-item';

                });

            }

        }
        function startOxygenCountdown(timeLeft) {
            // 显示氧气倒计时
        }

            // 处理特效，如屏障、诅咒等，简化：忽略
        }

        // ==================== 游戏循环 ====================
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (gameState === 'playing' && myAlive && !mySpectating) {
                // 移动
                const speed = 3;
                myPosition.x += joystickVec.x * speed;
                myPosition.y += joystickVec.y * speed;
                myPosition.x = Math.max(0, Math.min(1000, myPosition.x));
                myPosition.y = Math.max(0, Math.min(700, myPosition.y));
                if (joystickVec.x !== 0 || joystickVec.y !== 0) {
                    socket.emit('player_move', { position: myPosition });
                }
                // 更新本地玩家位置
                players[myId].position = myPosition;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 绘制地图
            drawMap();
            // 绘制玩家
            drawPlayers();
            // 绘制小地图
            drawMinimap();
            // 绘制摇杆
            drawJoystick();
        }

        function drawMap() {
            // 背景网格
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            // 房间
            ROOMS.forEach(room => {
                ctx.save();
                ctx.translate(mapOffset.x, mapOffset.y);
                ctx.scale(zoom, zoom);
                ctx.shadowBlur = 10;
                ctx.shadowColor = room.color;
                ctx.strokeStyle = room.color;
                ctx.lineWidth = 2;
                ctx.strokeRect(room.x, room.y, room.w, room.h);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(room.x, room.y, room.w, room.h);
                // 房间名
                ctx.font = 'bold 20px Orbitron, monospace';
                ctx.fillStyle = room.color;
                ctx.fillText(room.name, room.x + 10, room.y - 5);
                ctx.restore();
                // 绘制房间内装饰（简化）
                drawRoomItems(room);
            });
            // 管道
            VENTS.forEach(vent => {
                ctx.save();
                ctx.translate(mapOffset.x, mapOffset.y);
                ctx.scale(zoom, zoom);
                ctx.beginPath();
                ctx.arc(vent.x, vent.y, 12, 0, Math.PI * 2);
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f0ff';
                ctx.stroke();
                ctx.restore();
            });
            // 紧急按钮
            ctx.save();
            ctx.translate(mapOffset.x, mapOffset.y);
            ctx.scale(zoom, zoom);
            ctx.beginPath();
            ctx.arc(EMERGENCY_BUTTON_POS.x, EMERGENCY_BUTTON_POS.y, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#ff3131';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff3131';
            ctx.fill();
            ctx.restore();
        }

        function drawRoomItems(room) {
            ctx.save();
            ctx.translate(mapOffset.x, mapOffset.y);
            ctx.scale(zoom, zoom);
            ctx.fillStyle = 'rgba(0,240,255,0.3)';
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 1;
            // 简单装饰
            if (room.items.includes('table')) {
                ctx.beginPath();
                ctx.arc(room.x + room.w/2, room.y + room.h/2, 30, 0, Math.PI*2);
                ctx.stroke();
            }
            if (room.items.includes('chair')) {
                for (let i = 0; i < 4; i++) {
                    const angle = i * Math.PI/2;
                    ctx.beginPath();
                    ctx.arc(room.x + room.w/2 + Math.cos(angle)*50, room.y + room.h/2 + Math.sin(angle)*50, 10, 0, Math.PI*2);
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        function drawPlayers() {
            for (const [sid, p] of Object.entries(players)) {
                if (!p.alive && !mySpectating) continue; // 幽灵不显示给活人
                if (sid === myId && !myAlive && !mySpectating) continue; // 自己幽灵可见
                ctx.save();
                ctx.translate(mapOffset.x, mapOffset.y);
                ctx.scale(zoom, zoom);
                const x = p.position.x;
                const y = p.position.y;
                // 六边形
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = i * Math.PI / 3;
                    const px = x + Math.cos(angle) * 20;
                    const py = y + Math.sin(angle) * 20;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                let color = '#00f0ff';
                if (sid === myId && isImpostor && p.alive) color = '#ff3131';
                if (!p.alive) color = '#808080';
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = color;
                ctx.stroke();
                // 表情符号
                ctx.font = '20px sans-serif';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.fillText(getPlayerEmoji(sid), x, y + 7);
                // 名字
                ctx.font = '12px Orbitron, monospace';
                ctx.fillStyle = '#fff';
                ctx.fillText(p.name, x, y - 25);
                // 伙伴名称（仅自己可见）
                if (sid === myId && myPartnerName) {
                    ctx.font = '10px Orbitron, monospace';
                    ctx.fillStyle = 'rgba(180,0,255,0.7)';
                    ctx.fillText(myPartnerName, x, y + 35);
                }
                ctx.restore();
            }
        }

        function getPlayerEmoji(sid) {
            const emojis = ['🤖','👾','🧬','💀','👽','🦾','🦿','🎃','🤠','👻','🧞‍♂️','🧜‍♂️','🧞‍♀️','🧞','🧜‍♀️','🧜🏾','🧚‍♀️','🧚🏻','🧚‍♂️','🪼','🦋','🪲','🪳','🕷','🪰','🔥','🍔','🍞','🍗'];
            let hash = 0;
            for (let i = 0; i < sid.length; i++) hash = sid.charCodeAt(i) + ((hash << 5) - hash);
            return emojis[Math.abs(hash) % emojis.length];
        }

        function drawMinimap() {
            minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            minimapCtx.fillStyle = 'rgba(0,0,0,0.7)';
            minimapCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            const scale = 120 / 1000;
            ROOMS.forEach(room => {
                minimapCtx.strokeStyle = room.color;
                minimapCtx.lineWidth = 1;
                minimapCtx.strokeRect(room.x * scale, room.y * scale, room.w * scale, room.h * scale);
            });
            // 紧急按钮
            minimapCtx.fillStyle = '#ff3131';
            minimapCtx.beginPath();
            minimapCtx.arc(EMERGENCY_BUTTON_POS.x * scale, EMERGENCY_BUTTON_POS.y * scale, 3, 0, Math.PI*2);
            minimapCtx.fill();
            // 自己位置
            if (myId && players[myId]) {
                minimapCtx.fillStyle = '#00f0ff';
                minimapCtx.beginPath();
                minimapCtx.moveTo(players[myId].position.x * scale, (players[myId].position.y - 5) * scale);
                minimapCtx.lineTo((players[myId].position.x - 4) * scale, (players[myId].position.y + 5) * scale);
                minimapCtx.lineTo((players[myId].position.x + 4) * scale, (players[myId].position.y + 5) * scale);
                minimapCtx.closePath();
                minimapCtx.fill();
            }
        }

        // ==================== 工具函数 ====================
        function findNearestAlivePlayer(range) {
            let nearest = null;
            let minDist = range;
            for (const p of Object.values(players)) {
                if (p.socketId === myId || !p.alive || p.spectating) continue;
                const dx = p.position.x - myPosition.x;
                const dy = p.position.y - myPosition.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = p;
                }
            }
            return nearest;
        }

                if (myPartnerId === 'yezhu') menuHtml += '<button class="neon-btn" onclick="useAbility(\'disguise\')">伪装</button>';

                if (myPartnerId === 'hewal') menuHtml += '<button class="neon-btn" onclick="useAbility(\'check\')">查验</button>';

            if (menuHtml) {

        function useAbility(type) {
            socket.emit('ability_use', { abilityType: type });
        }

            socket.emit('vent', { targetVentId: ventId });

            div.className = 'glass-panel';
            div.innerHTML = '<button class="neon-btn" onclick="socket.emit(\'sabotage\',{system:\'power\'})">电力破坏</button><button class="neon-btn" onclick="socket.emit(\'sabotage\',{system:\'oxygen\'})">氧气破坏</button>';

            div.style.bottom = '200px';

    </script>
