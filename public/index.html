<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Cyberpunk Impostor - 伙伴附着系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }

    :root {
      --neon-cyan: #00f0ff;
      --neon-magenta: #ff00ff;
      --neon-purple: #b300ff;
      --alert-red: #ff3131;
      --bg-dark: #0a0a0a;
      --glass: rgba(10,10,10,0.85);
    }

    body {
      background: var(--bg-dark);
      color: var(--neon-cyan);
      font-family: 'Orbitron', 'Microsoft YaHei', 'PingFang SC', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #gameCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    .scanlines {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.02) 50%, transparent 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 1000;
      animation: scanlineMove 8s linear infinite;
    }

    @keyframes scanlineMove {
      0% { background-position: 0 0; }
      100% { background-position: 0 100%; }
    }

    .cyber-panel {
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0,240,255,0.4);
      box-shadow: 0 0 15px rgba(0,240,255,0.3), inset 0 0 20px rgba(0,240,255,0.05);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    .cyber-panel::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      animation: borderFlow 3s linear infinite;
    }

    @keyframes borderFlow {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .cyber-btn {
      background: rgba(0,240,255,0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Orbitron', monospace;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(0,240,255,0.2);
      position: relative;
      overflow: hidden;
    }

    .cyber-btn:hover, .cyber-btn:active {
      background: rgba(0,240,255,0.25);
      box-shadow: 0 0 20px rgba(0,240,255,0.5);
      transform: translateY(-1px);
    }

    .cyber-btn.red {
      border-color: var(--alert-red);
      color: var(--alert-red);
      background: rgba(255,49,49,0.1);
      box-shadow: 0 0 10px rgba(255,49,49,0.2);
    }

    .cyber-btn.red:hover {
      background: rgba(255,49,49,0.25);
      box-shadow: 0 0 20px rgba(255,49,49,0.5);
    }

    .cyber-input {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,240,255,0.3);
      color: var(--neon-cyan);
      font-family: 'Orbitron', monospace;
      padding: 10px;
      border-radius: 4px;
      outline: none;
      width: 100%;
      font-size: 14px;
    }

    .cyber-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0,240,255,0.3);
    }

    #lobbyScreen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #0f0f1e 0%, #0a0a0a 100%);
    }

    .lobby-title {
      font-size: 32px;
      font-weight: 700;
      text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-purple);
      margin-bottom: 30px;
      letter-spacing: 4px;
      text-align: center;
    }

    .lobby-form {
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .player-list {
      margin-top: 20px;
      width: 90%;
      max-width: 400px;
      max-height: 200px;
      overflow-y: auto;
    }

    .player-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid rgba(0,240,255,0.1);
      font-size: 14px;
    }

    .player-item .emoji { font-size: 20px; margin-right: 10px; }
    .player-item .ready { color: #00ff88; margin-left: auto; font-size: 11px; }

    #companionScreen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background: radial-gradient(ellipse at center, #0f0f1e 0%, #0a0a0a 100%);
      overflow-y: auto;
    }

    .companion-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 500px;
      margin-top: 20px;
    }

    .companion-card {
      background: rgba(10,10,10,0.8);
      border: 1px solid rgba(0,240,255,0.3);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }

    .companion-card:hover, .companion-card.selected {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0,240,255,0.3);
      transform: scale(1.02);
    }

    .companion-card.taken {
      opacity: 0.4;
      pointer-events: none;
      border-color: #333;
    }

    .companion-card h3 {
      font-size: 14px;
      margin-bottom: 5px;
      color: var(--neon-magenta);
    }

    .companion-card p {
      font-size: 10px;
      color: #aaa;
      line-height: 1.4;
    }

    #gameHUD {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 50;
      pointer-events: none;
      display: none;
    }

    #taskPanel {
      position: absolute;
      top: 10px; left: 10px;
      width: 220px;
      max-height: 300px;
      padding: 12px;
      pointer-events: auto;
      transition: transform 0.3s;
    }

    #taskPanel.collapsed { transform: translateX(-90%); }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .task-item {
      font-size: 11px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(0,240,255,0.1);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .task-item.done { text-decoration: line-through; color: #00ff88; }
    .task-arrow { color: var(--neon-magenta); animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .charge-display {
      margin-top: 10px;
      font-size: 14px;
      color: var(--neon-purple);
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(0,0,0,0.5);
      border-radius: 3px;
      margin-top: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      transition: width 0.5s;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    #minimap {
      position: absolute;
      top: 10px; right: 10px;
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(0,240,255,0.5);
      background: rgba(0,0,0,0.7);
      overflow: hidden;
      pointer-events: auto;
    }

    .minimap-controls {
      position: absolute;
      top: 135px; right: 10px;
      display: flex;
      gap: 5px;
    }

    .minimap-btn {
      width: 30px; height: 30px;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      border-radius: 4px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    #joystick {
      position: absolute;
      bottom: 20px; left: 20px;
      width: 120px; height: 120px;
      pointer-events: auto;
      touch-action: none;
    }

    .joystick-base {
      position: absolute;
      width: 100%; height: 100%;
      border: 2px solid var(--neon-cyan);
      border-radius: 50%;
      background: rgba(0,240,255,0.05);
      box-shadow: 0 0 15px rgba(0,240,255,0.2);
    }

    .joystick-knob {
      position: absolute;
      width: 50px; height: 50px;
      background: radial-gradient(circle, var(--neon-magenta), rgba(255,0,255,0.3));
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px var(--neon-magenta);
      transition: none;
    }

    #actionButtons {
      position: absolute;
      bottom: 20px; right: 20px;
      display: grid;
      grid-template-columns: repeat(2, 60px);
      gap: 10px;
      pointer-events: auto;
    }

    .action-btn {
      width: 60px; height: 60px;
      background: rgba(0,240,255,0.1);
      border: 1px solid var(--neon-cyan);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .action-btn:active {
      transform: scale(0.9);
      background: rgba(0,240,255,0.3);
    }

    .action-btn.kill {
      border-color: var(--alert-red);
      background: rgba(255,49,49,0.15);
      display: none;
    }

    .action-btn.cooldown {
      opacity: 0.5;
      pointer-events: none;
    }

    .action-btn .cd-text {
      position: absolute;
      font-size: 10px;
      color: white;
      font-family: 'Orbitron', monospace;
    }

    #meetingScreen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 200;
      display: none;
      background: rgba(0,0,0,0.85);
      flex-direction: column;
      padding: 20px;
    }

    .meeting-header {
      text-align: center;
      font-size: 24px;
      margin-bottom: 15px;
      text-shadow: 0 0 10px var(--neon-cyan);
    }

    .meeting-timer {
      text-align: center;
      font-size: 36px;
      color: var(--neon-magenta);
      margin-bottom: 15px;
      font-weight: 700;
    }

    .voting-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .vote-item {
      display: flex;
      align-items: center;
      padding: 10px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,240,255,0.2);
      border-radius: 6px;
    }

    .vote-item .v-emoji { font-size: 24px; margin-right: 10px; }
    .vote-item .v-name { flex: 1; font-size: 14px; }
    .vote-item .v-status { font-size: 11px; margin-right: 10px; opacity: 0.7; }

    .vote-btn {
      padding: 6px 14px;
      background: rgba(0,240,255,0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      cursor: pointer;
      border-radius: 4px;
    }

    .vote-btn.voted {
      background: var(--neon-cyan);
      color: #000;
    }

    .chat-area {
      height: 150px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,240,255,0.2);
      border-radius: 6px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .chat-msg { margin-bottom: 5px; word-break: break-all; }
    .chat-msg.ghost { color: var(--neon-purple); opacity: 0.7; }
    .chat-msg .chat-name { color: var(--neon-magenta); font-weight: 700; }

    .chat-input-area {
      display: flex;
      gap: 8px;
    }

    #taskOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 300;
      display: none;
      background: rgba(0,0,0,0.9);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .task-window {
      width: 90%;
      max-width: 400px;
      padding: 20px;
      text-align: cent;
      text-align: center;
    }

    .task-title {
      font-size: 20px;
      margin-bottom: 15px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
    }

    .task-timer {
      font-size: 28px;
      color: var(--alert-red);
      margin-bottom: 15px;
    }

    .swipe-track {
      width: 100%;
      height: 60px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      position: relative;
      margin: 15px 0;
      overflow: hidden;
    }

    .swipe-zone {
      position: absolute;
      left: 60%; width: 20%; height: 100%;
      background: rgba(0,255,0,0.2);
      border-left: 1px solid #0f0;
      border-right: 1px solid #0f0;
    }

    .swipe-card {
      position: absolute;
      left: 0; top: 0;
      width: 40px; height: 100%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .wiring-container {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      margin: 20px 0;
    }

    .wire-col {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .wire-port {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2px solid;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
    }

    .wire-port.connected {
      box-shadow: 0 0 15px currentColor;
    }

    .fan-container {
      width: 200px; height: 200px;
      margin: 20px auto;
      position: relative;
      border-radius: 50%;
      border: 3px solid var(--neon-cyan);
      overflow: hidden;
      background: #111;
    }

    .fan-blade {
      position: absolute;
      top: 50%; left: 50%;
      width: 90px; height: 30px;
      background: rgba(0,240,255,0.3);
      transform-origin: 0 50%;
      border-radius: 0 50% 50% 0;
    }

    .fan-stain {
      position: absolute;
      width: 30px; height: 30px;
      background: rgba(139,69,19,0.7);
      border-radius: 50%;
      cursor: pointer;
      animation: stainPulse 2s infinite;
    }

    @keyframes stainPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .password-lock {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }

    .digit-wheel {
      width: 50px; height: 70px;
      background: rgba(0,0,0,0.6);
      border: 2px solid var(--neon-cyan);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    .digit-wheel::before, .digit-wheel::after {
      content: '▲';
      position: absolute;
      font-size: 12px;
      color: var(--neon-cyan);
      left: 50%; transform: translateX(-50%);
    }

    .digit-wheel::before { top: 2px; }
    .digit-wheel::after { bottom: 2px; transform: translateX(-50%) rotate(180deg); }

    .antenna-container {
      width: 250px; height: 250px;
      margin: 20px auto;
      position: relative;
      border-radius: 50%;
      border: 2px solid var(--neon-cyan);
    }

    .signal-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0,240,255,0.3);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    .antenna-target {
      position: absolute;
      width: 20px; height: 20px;
      background: var(--alert-red);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--alert-red);
    }

    .antenna-crosshair {
      position: absolute;
      width: 30px; height: 30px;
      border: 2px solid #0f0;
      border-radius: 50%;
      cursor: grab;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    .upload-container {
      width: 100%;
      height: 40px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      position: relative;
      margin: 20px 0;
      overflow: hidden;
    }

    .upload-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      width: 0%;
      transition: width 0.1s;
    }

    .interference {
      position: absolute;
      top: 0; height: 100%;
      width: 30px;
      background: var(--alert-red);
      cursor: pointer;
      box-shadow: 0 0 10px var(--alert-red);
    }

    #ejectedScreen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 500;
      display: none;
      background: rgba(0,0,0,0.9);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .ejected-title {
      font-size: 28px;
      color: var(--alert-red);
      text-shadow: 0 0 20px var(--alert-red);
      animation: glitch 1s infinite;
    }

    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(2px, -2px); }
      60% { transform: translate(-2px, -2px); }
      80% { transform: translate(2px, 2px); }
    }

    #spectateScreen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 400;
      display: none;
      pointer-events: none;
    }

    .spectate-controls {
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    #ghostIndicator {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      opacity: 0.3;
      pointer-events: none;
      display: none;
    }

    #sabotageAlert {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 150;
      display: none;
      font-size: 48px;
      color: var(--alert-red);
      text-shadow: 0 0 30px var(--alert-red);
      animation: alertPulse 0.5s infinite;
    }

    @keyframes alertPulse {
      0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); }
    }

    .oxygen-timer {
      position: absolute;
      top: 50px; left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      color: var(--alert-red);
      text-shadow: 0 0 20px var(--alert-red);
      display: none;
    }

    #ventMap {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 250;
      display: none;
      background: rgba(0,0,0,0.9);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .vent-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .vent-option {
      width: 60px; height: 60px;
      border: 2px solid var(--neon-cyan);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(0,240,255,0.1);
      font-size: 24px;
    }

    .vent-option:hover {
      background: rgba(0,240,255,0.3);
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    #impostorChat {
      position: absolute;
      bottom: 100px; right: 20px;
      width: 200px;
      max-height: 150px;
      display: none;
      pointer-events: auto;
    }

    .impostor-chat-area {
      height: 100px;
      overflow-y: auto;
      font-size: 11px;
      padding: 8px;
      background: rgba(255,49,49,0.1);
      border: 1px solid rgba(255,49,49,0.3);
      border-radius: 4px;
      margin-bottom: 5px;
    }

    #gameEndScreen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 600;
      display: none;
      background: rgba(0,0,0,0.9);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .winner-text {
      font-size: 48px;
      font-weight: 700;
      text-shadow: 0 0 30px currentColor;
    }

    .winner-crew { color: var(--neon-cyan); }
    .winner-impostor { color: var(--alert-red); }

    .glitch-text {
      position: relative;
    }

    .glitch-text::before, .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    .glitch-text::before {
      color: var(--neon-cyan);
      clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
      animation: glitchTop 2s infinite linear alternate-reverse;
    }

    .glitch-text::after {
      color: var(--neon-magenta);
      clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
      animation: glitchBottom 2s infinite linear alternate-reverse;
    }

    @keyframes glitchTop {
      0% { transform: translateX(0); }
      20% { transform: translateX(-3px); }
      40% { transform: translateX(3px); }
      60% { transform: translateX(-1px); }
      80% { transform: translateX(2px); }
      100% { transform: translateX(0); }
    }

    @keyframes glitchBottom {
      0% { transform: translateX(0); }
      20% { transform: translateX(3px); }
      40% { transform: translateX(-3px); }
      60% { transform: translateX(1px); }
      80% { transform: translateX(-2px); }
      100% { transform: translateX(0); }
    }

    .control-warning {
      position: fixed;
      top: 20%; left: 50%;
      transform: translateX(-50%);
      z-index: 350;
      display: none;
      font-size: 24px;
      color: var(--alert-red);
      text-shadow: 0 0 20px var(--alert-red);
      animation: warningBlink 0.5s infinite;
    }

    @keyframes warningBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <canvas id="gameCanvas"></canvas>


  <!-- 大厅 -->
  <div id="lobbyScreen">

      <input type="text" class="cyber-input" id="roomCode" placeholder="输入6位房间号" maxlength="6">

  <div id="companionScreen">
    <div style="font-size: 24px; text-shadow: 0 0 10px var(--neon-cyan); margin-bottom: 10px;">选择你的伙伴</div>

  </div>

  <!-- 游戏HUD -->
  <div id="gameHUD">
    <div id="taskPanel" class="cyber-panel">
      <div class="task-header" id="taskHeader">
        <span>📋 当前任务</span>

      </div>
      <div id="taskList"></div>
      <div class="charge-display" id="chargeDisplay">🔋 × 0/3</div>
      <div class="progress-bar"><div class="progress-fill" id="taskProgress" style="width:0%"></div></div>
    </div>

    <canvas id="minimap"></canvas>
    <div class="minimap-controls">

      <input type="text" class="cyber-input" id="chatInput" placeholder="输入消息...">

    </div>

  <!-- 任务QTE -->
  <div id="taskOverlay">
    <div class="task-window cyber-panel" id="taskWindow"></div>
  </div>

  <!-- 管道地图 -->
  <div id="ventMap">
    <div style="font-size: 20px; margin-bottom: 20px;">选择传送目标</div>

  <!-- 放逐界面 -->
  <div id="ejectedScreen">
    <div class="ejected-title">⚡ 你已被放逐 ⚡</div>
